<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800"><rect x="0" y="0" width="360" height="800" fill="#D7C6A2"/><text x="14" y="25" font-family="'Oswald','Arial Narrow',sans-serif" font-size="13.5" font-weight="600" fill="#241C2E" letter-spacing="1.6">To-Do-List</text><g fill="none" stroke="#575046" stroke-width="1.2" stroke-linecap="square"><circle cx="338.5" cy="17" r="3"/><path d="M338.5 10.5 v2 M338.5 21 v2 M332 17 h2 M343 17 h2"/></g><line x1="0" y1="38" x2="360" y2="38" stroke="#B9A982" stroke-width="1"/><text x="14" y="56" font-family="'Oswald','Arial Narrow',sans-serif" font-size="12" font-weight="600" fill="#241C2E" letter-spacing="1.2">SETTINGS</text><line x1="14" y1="62" x2="346" y2="62" stroke="#B9A982" stroke-width="1"/><text x="14" y="80" font-family="'Oswald','Arial Narrow',sans-serif" font-size="9" font-weight="600" fill="#241C2E" letter-spacing="1.1">SUGGESTION ENGINE</text><line x1="14" y1="85" x2="346" y2="85" stroke="#CFC0A0" stroke-width="1"/><rect x="14" y="94" width="332" height="76" fill="#EFE6D2"/><rect x="14" y="94" width="332" height="76" fill="none" stroke="#575046" stroke-width="1"/><rect x="26" y="109" width="9" height="9" fill="none" stroke="#575046" stroke-width="0.9"/><text x="30.5" y="116" font-family="'Oswald','Arial Narrow',sans-serif" font-size="6.5" font-weight="600" fill="#575046" text-anchor="middle">R</text><text x="39" y="116" font-family="'Oswald','Arial Narrow',sans-serif" font-size="10" font-weight="500" fill="#575046" letter-spacing="0.6">RULE ENGINE</text><g transform="rotate(-1.6 286.0 112.5)"><rect x="238" y="104" width="96" height="17" fill="#241C2E" opacity="0.08"/><rect x="238" y="104" width="96" height="17" fill="none" stroke="#241C2E" stroke-width="1.3"/><text x="286.0" y="115.38" font-family="'Oswald','Arial Narrow',sans-serif" font-size="8" font-weight="600" fill="#241C2E" text-anchor="middle" letter-spacing="1.1">SERVING</text></g><text x="26" y="136" font-family="'Public Sans','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="500" fill="#241C2E">No API Key is configured.</text><text x="26" y="150" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#575046" letter-spacing="0.6">EVERY SUGGESTION IS PRODUCED ON THIS DEVICE, OFFLINE,</text><text x="26" y="161" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#575046" letter-spacing="0.6">WITH NO ACCOUNT. THIS IS THE NORMAL STATE, NOT A LIMIT.</text><text x="14" y="192" font-family="'Oswald','Arial Narrow',sans-serif" font-size="9" font-weight="600" fill="#241C2E" letter-spacing="1.1">API KEY</text><line x1="14" y1="197" x2="346" y2="197" stroke="#CFC0A0" stroke-width="1"/><rect x="14" y="206" width="244" height="28" fill="#EFE6D2"/><rect x="14" y="206" width="244" height="28" fill="none" stroke="#575046" stroke-width="1"/><text x="24" y="224" font-family="'Public Sans','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#575046">Paste an Anthropic API Key</text><rect x="264" y="206" width="82" height="28" fill="#EFE6D2"/><rect x="264" y="206" width="82" height="28" fill="none" stroke="#575046" stroke-width="1"/><text x="305.0" y="223.0" font-family="'Oswald','Arial Narrow',sans-serif" font-size="9" font-weight="500" fill="#241C2E" text-anchor="middle" letter-spacing="0.8">SAVE</text><text x="14" y="248" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#575046" letter-spacing="0.6">OPTIONAL. STORED ON THIS DEVICE ONLY. NEVER WRITTEN TO THE</text><text x="14" y="259" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#575046" letter-spacing="0.6">REPOSITORY, AND NEVER SENT ANYWHERE BUT ANTHROPIC.</text><text x="14" y="286" font-family="'Oswald','Arial Narrow',sans-serif" font-size="9" font-weight="600" fill="#241C2E" letter-spacing="1.1">CLOUD SUGGESTIONS</text><line x1="14" y1="291" x2="346" y2="291" stroke="#CFC0A0" stroke-width="1"/><rect x="14" y="300" width="332" height="54" fill="#E6DAC0" opacity="0.5"/><rect x="14" y="300" width="332" height="54" fill="none" stroke="#CFC0A0" stroke-width="1" stroke-dasharray="3 3"/><text x="26" y="322" font-family="'Oswald','Arial Narrow',sans-serif" font-size="8.5" font-weight="500" fill="#575046" letter-spacing="0.7">APPEARS ONCE A KEY IS SAVED</text><text x="26" y="338" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#575046" letter-spacing="0.6">OFF UNTIL YOU TURN IT ON. SAVING A KEY NEVER TURNS IT ON.</text><text x="14" y="378" font-family="'Oswald','Arial Narrow',sans-serif" font-size="9" font-weight="600" fill="#241C2E" letter-spacing="1.1">MEASURED ACCURACY</text><line x1="14" y1="383" x2="346" y2="383" stroke="#CFC0A0" stroke-width="1"/><text x="14" y="400" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#575046" letter-spacing="0.7">FIXTURE ENTRIES</text><text x="346" y="400" font-family="'Oswald','Arial Narrow',sans-serif" font-size="8.5" font-weight="500" fill="#241C2E" letter-spacing="0.4" text-anchor="end" style="font-variant-numeric:tabular-nums">NOT SCORED YET</text><text x="14" y="413" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#575046" letter-spacing="0.7">TAGS · PRIORITY · DUE DATE · PLACEMENT</text><text x="346" y="413" font-family="'Oswald','Arial Narrow',sans-serif" font-size="8.5" font-weight="500" fill="#241C2E" letter-spacing="0.4" text-anchor="end" style="font-variant-numeric:tabular-nums">REPORTED APART</text><text x="14" y="426" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#575046" letter-spacing="0.7">SUMMARY</text><text x="346" y="426" font-family="'Oswald','Arial Narrow',sans-serif" font-size="8.5" font-weight="500" fill="#241C2E" letter-spacing="0.4" text-anchor="end" style="font-variant-numeric:tabular-nums">SCORED SEPARATELY</text><text x="14" y="446" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#575046" letter-spacing="0.6">THE APP PUBLISHES ITS OWN SCORE. IT DOES NOT CLAIM</text><text x="14" y="457" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#575046" letter-spacing="0.6">THE SUGGESTIONS ARE RIGHT.</text><text x="14" y="486" font-family="'Oswald','Arial Narrow',sans-serif" font-size="9" font-weight="600" fill="#241C2E" letter-spacing="1.1">ARCHIVE</text><line x1="14" y1="491" x2="346" y2="491" stroke="#CFC0A0" stroke-width="1"/><text x="14" y="510" font-family="'Oswald','Arial Narrow',sans-serif" font-size="8.5" font-weight="500" fill="#575046" letter-spacing="0.7">ARCHIVE COMPLETED TASKS AFTER</text><rect x="214" y="498" width="132" height="24" fill="#EFE6D2"/><rect x="214" y="498" width="132" height="24" fill="none" stroke="#575046" stroke-width="1"/><text x="226" y="514" font-family="'Public Sans','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#241C2E">30 days</text><path d="M326 508 l5 5 l5 -5" fill="none" stroke="#575046" stroke-width="1.3"/><line x1="14" y1="676" x2="346" y2="676" stroke="#B9A982" stroke-width="1"/><text x="14" y="690" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#575046" letter-spacing="0.5">AN ENGINE PROBLEM, IF THERE EVER IS ONE, IS SHOWN ONLY</text><text x="14" y="701" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#575046" letter-spacing="0.5">HERE. NEVER A POPUP, BANNER, TOAST OR BADGE ANYWHERE</text><text x="14" y="712" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#575046" letter-spacing="0.5">ELSE IN THE APP.</text><line x1="0" y1="754" x2="360" y2="754" stroke="#B9A982" stroke-width="1"/><g fill="none" stroke="#575046" stroke-width="1.1" stroke-linecap="square"><rect x="43" y="765" width="13" height="12" rx="1"/><line x1="43" y1="769" x2="56" y2="769"/><line x1="47" y1="763" x2="47" y2="766"/><line x1="52" y1="763" x2="52" y2="766"/></g><text x="49" y="791" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#575046" text-anchor="middle" letter-spacing="0.8">TODAY</text><g fill="none" stroke="#575046" stroke-width="1.1" stroke-linecap="square"><line x1="129" y1="766" x2="142" y2="766"/><line x1="129" y1="770.5" x2="142" y2="770.5"/><line x1="129" y1="775" x2="142" y2="775"/></g><text x="135" y="791" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#575046" text-anchor="middle" letter-spacing="0.8">LISTS</text><g fill="none" stroke="#575046" stroke-width="1.1" stroke-linecap="square"><rect x="215" y="764" width="13" height="4" rx="0.5"/><path d="M216.5 768 v8 h10 v-8"/><line x1="220" y1="771.5" x2="223" y2="771.5"/></g><text x="221" y="791" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#575046" text-anchor="middle" letter-spacing="0.8">ARCHIVE</text><g fill="none" stroke="#241C2E" stroke-width="1.3" stroke-linecap="square"><circle cx="307.5" cy="770" r="3"/><path d="M307.5 763.5 v2 M307.5 774 v2 M301 770 h2 M312 770 h2"/></g><text x="307" y="791" font-family="'Oswald','Arial Narrow',sans-serif" font-size="7.5" font-weight="500" fill="#241C2E" text-anchor="middle" letter-spacing="0.8">SETTINGS</text><rect x="294" y="758" width="27" height="1.6" fill="#A8271C"/></svg>
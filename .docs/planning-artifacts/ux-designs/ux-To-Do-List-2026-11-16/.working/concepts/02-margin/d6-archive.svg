C8C" stroke-width="1.2"/><g transform="translate(297,229) scale(0.8125)"><path d="M3,8.4 L6.4,11.8 L13,4.6" fill="none" stroke="#F4F0E6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="324" y="242" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#5C564B">Call the doctor</text><text x="856" y="236" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#1A1917" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">COMPLETED 09 OCT</text><text x="856" y="252" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.1em;font-variant-numeric:tabular-nums">PERSONAL &#183; MEDIUM</text><rect x="1136" y="226" width="100" height="32" rx="1" fill="none" stroke="#1A1917" stroke-width="1"/><text x="1186.0" y="245.4" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#1A1917" text-anchor="middle" style="letter-spacing:0.11em;font-variant-numeric:tabular-nums">RESTORE</text><line x1="296" y1="268" x2="816" y2="268" stroke="#C4BCA7" stroke-width="1"/><rect x="296" y="284" width="15" height="15" rx="1" fill="#FBF8F1" stroke="#1A1917" stroke-width="1.2"/><rect x="296" y="284" width="15" height="15" rx="1" fill="#2B4C8C" stroke="#2B4C8C" stroke-width="1.2"/><g transform="translate(297,285) scale(0.8125)"><path d="M3,8.4 L6.4,11.8 L13,4.6" fill="none" stroke="#F4F0E6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="324" y="298" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#5C564B">Buy birthday present next week</text><text x="856" y="292" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#1A1917" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">COMPLETED 02 OCT</text><text x="856" y="308" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.1em;font-variant-numeric:tabular-nums">PERSONAL &#183; MEDIUM</text><rect x="1136" y="282" width="100" height="32" rx="1" fill="none" stroke="#1A1917" stroke-width="1"/><text x="1186.0" y="301.4" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#1A1917" text-anchor="middle" style="letter-spacing:0.11em;font-variant-numeric:tabular-nums">RESTORE</text><line x1="296" y1="324" x2="816" y2="324" stroke="#C4BCA7" stroke-width="1"/><text x="296" y="372" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">Completing a task leaves it in its lists for 30 days, then moves it here.</text><text x="296" y="394" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#5C564B">Nothing is deleted unless you delete it, and restoring puts a task back</text><text x="296" y="414" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#5C564B">with its marks exactly as you set them.</text><line x1="296" y1="446" x2="816" y2="446" stroke="#C4BCA7" stroke-width="1"/><text x="296" y="470" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1A1917" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">A COMPLETED TASK KEEPS ITS MARKS</text><path d="M302,486 H296 V548 H302" fill="none" stroke="#2B4C8C" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="312" y="500" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">TAGS</text><g transform="translate(312,506) scale(1.0)"><path d="M2.6,2.6 H8.4 L13.4,7.6 L8,13 L2.6,7.8 Z" fill="none" stroke="#2B4C8C" stroke-width="1.25" stroke-linejoin="round"/><circle cx="5.4" cy="5.4" r="1.1" fill="#2B4C8C"/></g><text x="334" y="520" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="500" fill="#2B4C8C">personal</text><text x="312" y="544" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">PRIORITY</text><text x="856" y="500" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">SET BY YOU &#183; NEVER RE-DERIVED</text><g transform="translate(312,550) scale(0.9375)"><path d="M3,6.4 L8,11.2 L13,6.4" fill="none" stroke="#2B4C8C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="334" y="564" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="500" fill="#2B4C8C">low</text><text x="296" y="612" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#5C564B">Completed is drawn as a filled box and grey text, never as a strike &#8212; a strike</text><text x="296" y="632" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#5C564B">through text means a mark you rejected, and the two must not look alike.</text></svg>

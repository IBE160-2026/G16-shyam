<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><filter id="gr-d7" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect x="0" y="0" width="1280" height="800" rx="0" fill="#F4F0E6"/><rect width="1280" height="800" filter="url(#gr-d7)" opacity="0.055" style="mix-blend-mode:multiply"/><rect x="0" y="0" width="232" height="800" rx="0" fill="#EFEADC"/><line x1="232" y1="0" x2="232" y2="800" stroke="#C4BCA7" stroke-width="1"/><text x="24" y="50" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" fill="#1A1917">To-Do-List</text><line x1="0" y1="72" x2="232" y2="72" stroke="#C4BCA7" stroke-width="1"/><text x="24" y="108" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#5C564B" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">SMART LISTS</text><text x="36" y="136" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">Today</text><text x="208" y="136" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">10</text><text x="36" y="166" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">Due this week</text><text x="208" y="166" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">3</text><text x="36" y="196" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">Need Attention</text><text x="208" y="196" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">2</text><text x="36" y="226" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">High priority</text><text x="208" y="226" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">5</text><text x="24" y="262" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#5C564B" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">TAGS</text><text x="36" y="292" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">school</text><text x="208" y="292" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">3</text><text x="36" y="322" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">group</text><text x="208" y="322" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">1</text><text x="36" y="352" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">work</text><text x="208" y="352" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">1</text><text x="36" y="382" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">personal</text><text x="208" y="382" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">4</text><line x1="8" y1="408" x2="224" y2="408" stroke="#C4BCA7" stroke-width="1"/><text x="36" y="440" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">Archive</text><text x="208" y="440" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">3</text><rect x="8" y="450" width="216" height="30" rx="0" fill="#E7EAF2"/><path d="M19,456 H14 V474 H19" fill="none" stroke="#2B4C8C" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="470" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="600" fill="#2B4C8C">Settings</text><text x="24" y="756" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#5C564B" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">MONDAY 16 NOVEMBER</text><text x="24" y="772" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#5C564B" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">NO ACCOUNT &#183; NO SYNC</text><text x="296" y="104" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="27" font-weight="600" fill="#1A1917">Settings</text><text x="296" y="126" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">ONE DEVICE &#183; NO ACCOUNT &#183; NOTHING LEAVES WITHOUT CONSENT</text><line x1="296" y1="150" x2="816" y2="150" stroke="#C4BCA7" stroke-width="1"/><path d="M833,170 H840 V268 H833" fill="none" stroke="#5C564B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="856" y="184" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#1A1917" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">API KEY</text><text x="856" y="206" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">KEPT ON THIS DEVICE ONLY.</text><text x="856" y="222" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">NEVER IN THE REPOSITORY.</text><text x="856" y="248" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">YOUR OWN ANTHROPIC KEY.</text><g transform="translate(296,170) scale(1.0625)"><path d="M3,8.4 L6.4,11.8 L13,4.6" fill="none" stroke="#2B4C8C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="322" y="186" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#1A1917">A key is saved.</text><rect x="296" y="206" width="400" height="38" rx="1" fill="#FBF8F1" stroke="#B9AF97" stroke-width="1"/><text x="308" y="229.86" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#1A1917">sk-ant-api03-&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</text><rect x="706" y="206" width="100" height="38" rx="1" fill="none" stroke="#1A1917" stroke-width="1"/><text x="756.0" y="228.4" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1A1917" text-anchor="middle" style="letter-spacing:0.11em;font-variant-numeric:tabular-nums">REPLACE</text><text x="296" y="272" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">Saving a key does not turn anything on.</text><line x1="296" y1="300" x2="816" y2="300" stroke="#C4BCA7" stroke-width="1"/><path d="M833,320 H840 V500 H833" fill="none" stroke="#5C564B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="856" y="334" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#1A1917" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">CLOUD SUGGESTIONS</text><text x="856" y="356" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">OFF ON FIRST RUN, EVEN WITH</text><text x="856" y="372" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">A KEY ALREADY SAVED.</text><text x="856" y="398" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">THE RULE ENGINE IS NOT A</text><text x="856" y="414" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">FALLBACK. IT IS THE FLOOR.</text><rect x="296" y="322" width="17" height="17" rx="1" fill="#FBF8F1" stroke="#1A1917" stroke-width="1.2"/><text x="324" y="337" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#1A1917">Use Cloud Suggestions</text><text x="792" y="337" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5C564B" text-anchor="end" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">OFF</text><text x="296" y="368" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#5C564B">Turning this on sends your task text to the Anthropic API, billed to</text><text x="296" y="388" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#5C564B">your own key. Task text leaves this device only while it is on, and only</text><text x="296" y="408" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#5C564B">for the task you just typed. The Rule Engine keeps serving every</text><text x="296" y="428" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#5C564B">suggestion the Model Engine cannot answer.</text><line x1="296" y1="460" x2="816" y2="460" stroke="#C4BCA7" stroke-width="1"/><path d="M833,480 H840 V600 H833" fill="none" stroke="#5C564B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="856" y="494" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#1A1917" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">ENGINE IN USE</text><text x="856" y="516" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">ATTRIBUTION ON EVERY</text><text x="856" y="532" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">SUGGESTION SAYS WHICH.</text><g transform="translate(296,482) scale(0.9375)"><rect x="2" y="3" width="12" height="10" fill="none" stroke="#5C564B" stroke-width="1.1"/><line x1="2" y1="7" x2="14" y2="7" stroke="#5C564B" stroke-width="1.1"/><line x1="6" y1="3" x2="6" y2="13" stroke="#5C564B" stroke-width="1.1"/><line x1="10" y1="3" x2="10" y2="13" stroke="#5C564B" stroke-width="1.1"/></g><text x="318" y="496" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#1A1917">Rule Engine, on this device.</text><text x="296" y="524" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#5C564B">The Model Engine is not in use, because Cloud Suggestions is off.</text><text x="296" y="544" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#5C564B">Nothing is wrong.</text><line x1="296" y1="576" x2="816" y2="576" stroke="#C4BCA7" stroke-width="1"/><text x="296" y="600" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#1A1917" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">ARCHIVE</text><text x="296" y="626" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#5C564B">Completed tasks are archived after 30 days and can be restored.</text><text x="296" y="668" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">ENGINE PROBLEMS APPEAR HERE AND NOWHERE ELSE</text><text x="296" y="694" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#5C564B">No popup, banner, toast or badge, in capture, review or any list &#8212;</text><text x="296" y="713" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#5C564B">ever. If the Model Engine stops, suggestions do not.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><filter id="gr-d8" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect x="0" y="0" width="1280" height="800" rx="0" fill="#F4F0E6"/><rect width="1280" height="800" filter="url(#gr-d8)" opacity="0.055" style="mix-blend-mode:multiply"/><rect x="0" y="0" width="232" height="800" rx="0" fill="#EFEADC"/><line x1="232" y1="0" x2="232" y2="800" stroke="#C4BCA7" stroke-width="1"/><text x="24" y="50" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" fill="#1A1917">To-Do-List</text><line x1="0" y1="72" x2="232" y2="72" stroke="#C4BCA7" stroke-width="1"/><text x="24" y="108" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#5C564B" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">SMART LISTS</text><text x="36" y="136" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">Today</text><text x="208" y="136" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">10</text><text x="36" y="166" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">Due this week</text><text x="208" y="166" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">3</text><text x="36" y="196" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">Need Attention</text><text x="208" y="196" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">2</text><text x="36" y="226" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">High priority</text><text x="208" y="226" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">5</text><text x="24" y="262" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#5C564B" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">TAGS</text><text x="36" y="292" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">school</text><text x="208" y="292" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">3</text><text x="36" y="322" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">group</text><text x="208" y="322" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">1</text><text x="36" y="352" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">work</text><text x="208" y="352" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">1</text><text x="36" y="382" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">personal</text><text x="208" y="382" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">4</text><line x1="8" y1="408" x2="224" y2="408" stroke="#C4BCA7" stroke-width="1"/><text x="36" y="440" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">Archive</text><text x="208" y="440" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" text-anchor="end" style="letter-spacing:0.08em;font-variant-numeric:tabular-nums">3</text><rect x="8" y="450" width="216" height="30" rx="0" fill="#E7EAF2"/><path d="M19,456 H14 V474 H19" fill="none" stroke="#2B4C8C" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="470" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="600" fill="#2B4C8C">Settings</text><text x="24" y="756" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#5C564B" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">MONDAY 16 NOVEMBER</text><text x="24" y="772" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#5C564B" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">NO ACCOUNT &#183; NO SYNC</text><text x="296" y="104" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="27" font-weight="600" fill="#1A1917">Settings</text><text x="296" y="126" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">ONE DEVICE &#183; NO ACCOUNT &#183; ENGINE STATUS</text><line x1="296" y1="150" x2="816" y2="150" stroke="#C4BCA7" stroke-width="1"/><path d="M833,170 H840 V300 H833" fill="none" stroke="#5C564B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="856" y="184" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#1A1917" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">ENGINE STATUS</text><text x="856" y="206" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">THREE PLAIN STATEMENTS:</text><text x="856" y="222" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">WHAT, WHY, AND WHAT IS</text><text x="856" y="238" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">SERVING YOU INSTEAD.</text><text x="856" y="266" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">NO POPUP, NO BANNER, NO</text><text x="856" y="282" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">BADGE. ONLY THIS PAGE.</text><text x="296" y="184" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#1A1917">The Model Engine is not being used.</text><text x="296" y="216" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1A1917">The organisation that owns this API Key does not allow calls from</text><text x="296" y="238" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1A1917">a browser. The key itself is valid, and replacing it will not help.</text><text x="296" y="272" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#1A1917">The Rule Engine is serving suggestions normally.</text><text x="296" y="300" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#5C564B">Checked a moment ago. Nothing is waiting on you.</text><line x1="296" y1="326" x2="816" y2="326" stroke="#C4BCA7" stroke-width="1"/><path d="M833,346 H840 V500 H833" fill="none" stroke="#5C564B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="856" y="360" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#1A1917" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">THE OTHER TWO REASONS</text><text x="856" y="382" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">THIS READOUT CAN SHOW.</text><text x="856" y="408" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">EACH NAMES WHAT IS WRONG</text><text x="856" y="424" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">AND WHETHER YOU CAN ACT.</text><text x="296" y="350" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">INSTEAD OF THE REASON ABOVE</text><path d="M302,364 H296 V428 H302" fill="none" stroke="#5C564B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="314" y="384" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1A1917">The API Key was rejected. Check it and paste it again.</text><text x="314" y="404" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#5C564B">This one you can fix, and it is the only one of the three that you can.</text><text x="314" y="440" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1A1917">This key&#8217;s credit or quota is used up.</text><text x="314" y="460" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#5C564B">The key is in order. Topping up the account restores the Model Engine.</text><line x1="296" y1="492" x2="816" y2="492" stroke="#C4BCA7" stroke-width="1"/><path d="M833,512 H840 V660 H833" fill="none" stroke="#5C564B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="856" y="526" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#1A1917" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">CLOUD SUGGESTIONS</text><text x="856" y="548" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">STILL ON. IT STAYS ON.</text><text x="856" y="574" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">TURNING IT OFF IS YOURS</text><text x="856" y="590" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">TO DECIDE, NOT OURS.</text><rect x="296" y="514" width="17" height="17" rx="1" fill="#FBF8F1" stroke="#1A1917" stroke-width="1.2"/><rect x="296" y="514" width="17" height="17" rx="1" fill="#2B4C8C" stroke="#2B4C8C" stroke-width="1.2"/><g transform="translate(297,515) scale(0.9375)"><path d="M3,8.4 L6.4,11.8 L13,4.6" fill="none" stroke="#F4F0E6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="324" y="529" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#1A1917">Use Cloud Suggestions</text><text x="792" y="529" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5C564B" text-anchor="end" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">ON</text><text x="296" y="560" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#5C564B">It stays on. If the organisation lifts the restriction, the Model Engine</text><text x="296" y="580" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#5C564B">comes back on its own and attribution starts saying so again.</text><line x1="296" y1="612" x2="816" y2="612" stroke="#C4BCA7" stroke-width="1"/><text x="296" y="636" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#1A1917" style="letter-spacing:0.16em;font-variant-numeric:tabular-nums">API KEY</text><rect x="296" y="650" width="400" height="38" rx="1" fill="#FBF8F1" stroke="#B9AF97" stroke-width="1"/><text x="308" y="673.86" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#1A1917">sk-ant-api03-&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</text><rect x="706" y="650" width="100" height="38" rx="1" fill="none" stroke="#1A1917" stroke-width="1"/><text x="756.0" y="672.4" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1A1917" text-anchor="middle" style="letter-spacing:0.11em;font-variant-numeric:tabular-nums">REPLACE</text><text x="296" y="714" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#5C564B">Nothing about the key needs changing for this reason. It is kept here</text><text x="296" y="733" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#5C564B">so it still works the moment the restriction is lifted.</text><text x="856" y="664" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">REPLACING A VALID KEY</text><text x="856" y="680" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">WILL NOT CHANGE THIS.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800"><defs><filter id="gr-m8" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect x="0" y="0" width="360" height="800" rx="0" fill="#F4F0E6"/><rect width="360" height="800" filter="url(#gr-m8)" opacity="0.055" style="mix-blend-mode:multiply"/><text x="16" y="34" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="16" font-weight="600" fill="#1A1917">To-Do-List</text><g transform="translate(328,18) scale(1.0)"><circle cx="8" cy="8" r="2.4" fill="none" stroke="#5C564B" stroke-width="1.25"/><circle cx="8" cy="8" r="5.4" fill="none" stroke="#5C564B" stroke-width="1.25"/><line x1="13.40" y1="8.00" x2="15.40" y2="8.00" stroke="#5C564B" stroke-width="1.25" stroke-linecap="round"/><line x1="10.70" y1="12.68" x2="11.70" y2="14.41" stroke="#5C564B" stroke-width="1.25" stroke-linecap="round"/><line x1="5.30" y1="12.68" x2="4.30" y2="14.41" stroke="#5C564B" stroke-width="1.25" stroke-linecap="round"/><line x1="2.60" y1="8.00" x2="0.60" y2="8.00" stroke="#5C564B" stroke-width="1.25" stroke-linecap="round"/><line x1="5.30" y1="3.32" x2="4.30" y2="1.59" stroke="#5C564B" stroke-width="1.25" stroke-linecap="round"/><line x1="10.70" y1="3.32" x2="11.70" y2="1.59" stroke="#5C564B" stroke-width="1.25" stroke-linecap="round"/></g><line x1="0" y1="52" x2="360" y2="52" stroke="#C4BCA7" stroke-width="1"/><text x="16" y="82" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="21" font-weight="600" fill="#1A1917">Settings</text><line x1="16" y1="96" x2="344" y2="96" stroke="#C4BCA7" stroke-width="1"/><text x="16" y="120" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1A1917" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">SUGGESTION ENGINE</text><line x1="16" y1="126" x2="344" y2="126" stroke="#C4BCA7" stroke-width="1"/><g transform="translate(16,140) scale(1.0)"><path d="M3,8.4 L6.4,11.8 L13,4.6" fill="none" stroke="#2B4C8C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="40" y="153" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1A1917">The Rule Engine is serving</text><text x="40" y="173" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1A1917">suggestions on this device.</text><text x="16" y="199" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1A1917">No API Key is configured.</text><text x="16" y="222" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="12.5" font-weight="400" fill="#5C564B">It needs no key, no account and no network.</text><text x="16" y="239" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="12.5" font-weight="400" fill="#5C564B">This is the normal state, not a limited one.</text><line x1="16" y1="258" x2="344" y2="258" stroke="#C4BCA7" stroke-width="1"/><text x="16" y="282" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1A1917" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">API KEY</text><rect x="16" y="292" width="248" height="38" rx="1" fill="#FBF8F1" stroke="#B9AF97" stroke-width="1"/><text x="28" y="315.68" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#5C564B" font-style="italic">Paste an Anthropic API Key</text><rect x="272" y="292" width="72" height="38" rx="1" fill="none" stroke="#1A1917" stroke-width="1"/><text x="308.0" y="314.4" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#1A1917" text-anchor="middle" style="letter-spacing:0.11em;font-variant-numeric:tabular-nums">SAVE</text><text x="16" y="348" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="12" font-weight="400" fill="#5C564B">Kept on this device. Never in the repository.</text><line x1="16" y1="366" x2="344" y2="366" stroke="#C4BCA7" stroke-width="1"/><text x="16" y="390" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1A1917" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">CLOUD SUGGESTIONS</text><rect x="16" y="402" width="16" height="16" rx="1" fill="#FBF8F1" stroke="#1A1917" stroke-width="1.2"/><text x="42" y="416" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">Use Cloud Suggestions</text><text x="344" y="416" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#5C564B" text-anchor="end" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">OFF</text><text x="42" y="440" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="12.5" font-weight="400" fill="#5C564B">Turning this on sends your task text to the</text><text x="42" y="457" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="12.5" font-weight="400" fill="#5C564B">Anthropic API with your own key. The Rule</text><text x="42" y="474" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="12.5" font-weight="400" fill="#5C564B">Engine stays the fallback.</text><line x1="16" y1="494" x2="344" y2="494" stroke="#C4BCA7" stroke-width="1"/><text x="16" y="518" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1A1917" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">ENGINE STATUS</text><text x="16" y="544" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#1A1917">Rule Engine. Nothing to report.</text><text x="16" y="566" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="12.5" font-weight="400" fill="#5C564B">Engine problems only ever appear here &#8212; never</text><text x="16" y="583" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="12.5" font-weight="400" fill="#5C564B">in capture, review or a list.</text><line x1="16" y1="602" x2="344" y2="602" stroke="#C4BCA7" stroke-width="1"/><text x="16" y="626" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1A1917" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">ARCHIVE</text><text x="16" y="650" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="12.5" font-weight="400" fill="#5C564B">Completed tasks are archived after 30 days</text><text x="16" y="667" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="12.5" font-weight="400" fill="#5C564B">and can be restored.</text><text x="16" y="706" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#5C564B" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">TO-DO-LIST &#183; IBE160 &#183; ONE DEVICE, NO ACCOUNT</text><rect x="0" y="736" width="360" height="64" rx="0" fill="#EFEADC"/><line x1="0" y1="736" x2="360" y2="736" stroke="#C4BCA7" stroke-width="1"/><g transform="translate(36,752) scale(1.125)"><rect x="2" y="3" width="12" height="11" rx="1" fill="none" stroke="#5C564B" stroke-width="1.25"/><line x1="2" y1="6.6" x2="14" y2="6.6" stroke="#5C564B" stroke-width="1.25"/><rect x="4.6" y="9" width="2.6" height="2.6" fill="#5C564B"/></g><text x="45" y="788" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#5C564B" text-anchor="middle" style="letter-spacing:0.1em;font-variant-numeric:tabular-nums">TODAY</text><g transform="translate(126,752) scale(1.125)"><path d="M2.6,2.6 H8.4 L13.4,7.6 L8,13 L2.6,7.8 Z" fill="none" stroke="#5C564B" stroke-width="1.25" stroke-linejoin="round"/><circle cx="5.4" cy="5.4" r="1.1" fill="#5C564B"/></g><text x="135" y="788" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#5C564B" text-anchor="middle" style="letter-spacing:0.1em;font-variant-numeric:tabular-nums">LISTS</text><g transform="translate(216,752) scale(1.125)"><rect x="2" y="3.4" width="12" height="3" fill="none" stroke="#5C564B" stroke-width="1.25"/><path d="M3.2,6.4 V13 H12.8 V6.4" fill="none" stroke="#5C564B" stroke-width="1.25"/><line x1="6.2" y1="9.4" x2="9.8" y2="9.4" stroke="#5C564B" stroke-width="1.25" stroke-linecap="round"/></g><text x="225" y="788" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#5C564B" text-anchor="middle" style="letter-spacing:0.1em;font-variant-numeric:tabular-nums">ARCHIVE</text><g transform="translate(306,752) scale(1.125)"><circle cx="8" cy="8" r="2.4" fill="none" stroke="#2B4C8C" stroke-width="1.25"/><circle cx="8" cy="8" r="5.4" fill="none" stroke="#2B4C8C" stroke-width="1.25"/><line x1="13.40" y1="8.00" x2="15.40" y2="8.00" stroke="#2B4C8C" stroke-width="1.25" stroke-linecap="round"/><line x1="10.70" y1="12.68" x2="11.70" y2="14.41" stroke="#2B4C8C" stroke-width="1.25" stroke-linecap="round"/><line x1="5.30" y1="12.68" x2="4.30" y2="14.41" stroke="#2B4C8C" stroke-width="1.25" stroke-linecap="round"/><line x1="2.60" y1="8.00" x2="0.60" y2="8.00" stroke="#2B4C8C" stroke-width="1.25" stroke-linecap="round"/><line x1="5.30" y1="3.32" x2="4.30" y2="1.59" stroke="#2B4C8C" stroke-width="1.25" stroke-linecap="round"/><line x1="10.70" y1="3.32" x2="11.70" y2="1.59" stroke="#2B4C8C" stroke-width="1.25" stroke-linecap="round"/></g><text x="315" y="788" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#2B4C8C" text-anchor="middle" style="letter-spacing:0.1em;font-variant-numeric:tabular-nums">SETTINGS</text><line x1="293" y1="737" x2="337" y2="737" stroke="#2B4C8C" stroke-width="2"/></svg>

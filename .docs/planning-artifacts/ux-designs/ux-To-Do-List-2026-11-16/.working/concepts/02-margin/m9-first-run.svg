<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800"><defs><filter id="gr-m9" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect x="0" y="0" width="360" height="800" rx="0" fill="#F4F0E6"/><rect width="360" height="800" filter="url(#gr-m9)" opacity="0.055" style="mix-blend-mode:multiply"/><text x="16" y="34" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="16" font-weight="600" fill="#1A1917">To-Do-List</text><g transform="translate(328,18) scale(1.0)"><circle cx="8" cy="8" r="2.4" fill="none" stroke="#5C564B" stroke-width="1.25"/><circle cx="8" cy="8" r="5.4" fill="none" stroke="#5C564B" stroke-width="1.25"/><line x1="13.40" y1="8.00" x2="15.40" y2="8.00" stroke="#5C564B" stroke-width="1.25" stroke-linecap="round"/><line x1="10.70" y1="12.68" x2="11.70" y2="14.41" stroke="#5C564B" stroke-width="1.25" stroke-linecap="round"/><line x1="5.30" y1="12.68" x2="4.30" y2="14.41" stroke="#5C564B" stroke-width="1.25" stroke-linecap="round"/><line x1="2.60" y1="8.00" x2="0.60" y2="8.00" stroke="#5C564B" stroke-width="1.25" stroke-linecap="round"/><line x1="5.30" y1="3.32" x2="4.30" y2="1.59" stroke="#5C564B" stroke-width="1.25" stroke-linecap="round"/><line x1="10.70" y1="3.32" x2="11.70" y2="1.59" stroke="#5C564B" stroke-width="1.25" stroke-linecap="round"/></g><line x1="0" y1="52" x2="360" y2="52" stroke="#C4BCA7" stroke-width="1"/><rect x="16" y="64" width="328" height="40" rx="1" fill="#FBF8F1" stroke="#B9AF97" stroke-width="1"/><text x="28" y="88.86" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#5C564B" font-style="italic">Type a task the way you would say it</text><rect x="288" y="70" width="48" height="28" rx="1" fill="#1A1917"/><text x="312" y="88" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#F4F0E6" text-anchor="middle" style="letter-spacing:0.12em;font-variant-numeric:tabular-nums">ADD</text><text x="16" y="152" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="23" font-weight="400" fill="#1A1917">Type a task the way</text><text x="16" y="180" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="23" font-weight="400" fill="#1A1917">you would say it.</text><text x="16" y="214" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14.5" font-weight="400" fill="#5C564B">It is saved the moment you send it.</text><text x="16" y="235" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14.5" font-weight="400" fill="#5C564B">Then the app marks it up in the margin:</text><text x="16" y="256" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="14.5" font-weight="400" fill="#5C564B">a tag, a priority, a summary.</text><line x1="16" y1="278" x2="344" y2="278" stroke="#C4BCA7" stroke-width="1"/><text x="16" y="302" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1A1917" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">WHAT A MARK LOOKS LIKE</text><path d="M50,326 H44 V350 H50" fill="none" stroke="#B3261E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="48.0" y="340" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1A1917" textLength="45.9" lengthAdjust="spacingAndGlyphs">Submit</text><text x="98.0" y="340" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1A1917" textLength="71.4" lengthAdjust="spacingAndGlyphs">assignment</text><text x="173.5" y="340" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1A1917" textLength="12.0" lengthAdjust="spacingAndGlyphs">in</text><text x="189.6" y="340" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1A1917" textLength="46.0" lengthAdjust="spacingAndGlyphs">IBE160</text><text x="239.7" y="340" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1A1917" textLength="39.8" lengthAdjust="spacingAndGlyphs">Friday</text><path d="M98.0,344 V348 H169.4 V344" fill="none" stroke="#B3261E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M189.6,344 V348 H235.6 V344" fill="none" stroke="#B3261E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M133.7,348 L133.7,366 L212.6,366 L212.6,348" fill="none" stroke="#B3261E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M133.7,366 L34,366 L34,398 L44,398" fill="none" stroke="#B3261E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="44" y="382" width="300" height="72" rx="0" fill="#F7EBE7"/><path d="M50,387 H44 V449 H50" fill="none" stroke="#B3261E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="400" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1A1917" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">TAGS</text><text x="342" y="400" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#B3261E" text-anchor="end" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">PROPOSED</text><g transform="translate(52,410) scale(0.9375)"><path d="M2.6,2.6 H8.4 L13.4,7.6 L8,13 L2.6,7.8 Z" fill="none" stroke="#B3261E" stroke-width="1.25" stroke-linejoin="round"/><circle cx="5.4" cy="5.4" r="1.1" fill="#B3261E"/></g><text x="74" y="424" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="17" font-weight="500" fill="#B3261E">school</text><text x="52" y="444" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="11.5" font-weight="400" fill="#5C564B">You set it, amend it, or strike it out.</text><line x1="16" y1="476" x2="344" y2="476" stroke="#C4BCA7" stroke-width="1"/><text x="16" y="500" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1A1917" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">THE TWO INKS</text><path d="M21,512 H16 V528 H21" fill="none" stroke="#B3261E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="524" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="500" fill="#B3261E">school</text><text x="30" y="541" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="11.5" font-weight="400" fill="#5C564B">proposed &#8212; waiting on you</text><path d="M21,558 H16 V574 H21" fill="none" stroke="#2B4C8C" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="570" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="500" fill="#2B4C8C">high</text><text x="30" y="587" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="11.5" font-weight="400" fill="#5C564B">set &#8212; you accepted it</text><path d="M21,604 H16 V620 H21" fill="none" stroke="#1A1917" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="616" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1A1917">Study for the exam</text><text x="30" y="633" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="11.5" font-weight="400" fill="#5C564B">your own words &#8212; never rewritten</text><line x1="16" y1="664" x2="344" y2="664" stroke="#C4BCA7" stroke-width="1"/><text x="16" y="688" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#5C564B" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">NOTHING FILED YET</text><text x="16" y="712" font-family="'Spectral', Georgia, 'Times New Roman', serif" font-size="12.5" font-weight="400" fill="#5C564B">No account, no sync, nothing to set up.</text><rect x="0" y="736" width="360" height="64" rx="0" fill="#EFEADC"/><line x1="0" y1="736" x2="360" y2="736" stroke="#C4BCA7" stroke-width="1"/><g transform="translate(36,752) scale(1.125)"><rect x="2" y="3" width="12" height="11" rx="1" fill="none" stroke="#2B4C8C" stroke-width="1.25"/><line x1="2" y1="6.6" x2="14" y2="6.6" stroke="#2B4C8C" stroke-width="1.25"/><rect x="4.6" y="9" width="2.6" height="2.6" fill="#2B4C8C"/></g><text x="45" y="788" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#2B4C8C" text-anchor="middle" style="letter-spacing:0.1em;font-variant-numeric:tabular-nums">TODAY</text><line x1="23" y1="737" x2="67" y2="737" stroke="#2B4C8C" stroke-width="2"/><g transform="translate(126,752) scale(1.125)"><path d="M2.6,2.6 H8.4 L13.4,7.6 L8,13 L2.6,7.8 Z" fill="none" stroke="#5C564B" stroke-width="1.25" stroke-linejoin="round"/><circle cx="5.4" cy="5.4" r="1.1" fill="#5C564B"/></g><text x="135" y="788" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#5C564B" text-anchor="middle" style="letter-spacing:0.1em;font-variant-numeric:tabular-nums">LISTS</text><g transform="translate(216,752) scale(1.125)"><rect x="2" y="3.4" width="12" height="3" fill="none" stroke="#5C564B" stroke-width="1.25"/><path d="M3.2,6.4 V13 H12.8 V6.4" fill="none" stroke="#5C564B" stroke-width="1.25"/><line x1="6.2" y1="9.4" x2="9.8" y2="9.4" stroke="#5C564B" stroke-width="1.25" stroke-linecap="round"/></g><text x="225" y="788" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#5C564B" text-anchor="middle" style="letter-spacing:0.1em;font-variant-numeric:tabular-nums">ARCHIVE</text><g transform="translate(306,752) scale(1.125)"><circle cx="8" cy="8" r="2.4" fill="none" stroke="
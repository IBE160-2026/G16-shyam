<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800"><rect x="0" y="0" width="360" height="800" fill="#FCFBF8"/><rect x="0" y="0" width="360" height="46" fill="#EDE4D3"/><line x1="0" y1="45.5" x2="360" y2="45.5" stroke="#9B6B3F" stroke-width="1"/><text x="14" y="29" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="15" font-weight="700" fill="#1B1915" style="letter-spacing:0.09em">TO-DO-LIST</text><circle cx="336" cy="23" r="3.68" fill="none" stroke="#5C5345" stroke-width="1.4"/><line x1="341.409" y1="24.4494" x2="343.727" y2="25.0706" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><line x1="337.449" y1="28.4092" x2="338.071" y2="30.7274" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><line x1="332.04" y1="26.9598" x2="330.343" y2="28.6569" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><line x1="330.591" y1="21.5506" x2="328.273" y2="20.9294" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><line x1="334.551" y1="17.5908" x2="333.929" y2="15.2726" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><line x1="339.96" y1="19.0402" x2="341.657" y2="17.3431" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><rect x="12" y="58" width="250" height="32" fill="#FFFFFF" rx="2" stroke="#CBB08E" stroke-width="1"/><text x="22" y="78.32" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5C5345">Type a task the way you say it</text><rect x="270" y="58" width="78" height="32" fill="#1B1915" rx="2" stroke="#1B1915" stroke-width="1"/><text x="309" y="78.5" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Add</text><line x1="0" y1="99.5" x2="360" y2="99.5" stroke="#CBB08E" stroke-width="1"/><rect x="0" y="746" width="360" height="54" fill="#EDE4D3"/><line x1="0" y1="746.5" x2="360" y2="746.5" stroke="#9B6B3F" stroke-width="1"/><circle cx="39" cy="763.6" r="1.25" fill="#5C5345"/><line x1="42.6" y1="763.6" x2="52" y2="763.6" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><circle cx="39" cy="768" r="1.25" fill="#5C5345"/><line x1="42.6" y1="768" x2="52" y2="768" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><circle cx="39" cy="772.4" r="1.25" fill="#5C5345"/><line x1="42.6" y1="772.4" x2="52" y2="772.4" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><text x="45" y="789" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" text-anchor="middle" style="letter-spacing:0.08em">TODAY</text><rect x="129.5" y="763.5" width="11" height="9" fill="none" rx="0.8" stroke="#5C5345" stroke-width="1.4"/><line x1="133.2" y1="763.5" x2="133.2" y2="772.5" stroke="#5C5345" stroke-width="1.12"/><line x1="136.8" y1="763.5" x2="136.8" y2="772.5" stroke="#5C5345" stroke-width="1.12"/><text x="135" y="789" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" text-anchor="middle" style="letter-spacing:0.08em">LISTS</text><rect x="217.5" y="761.6" width="15" height="4.4" fill="none" rx="1" stroke="#5C5345" stroke-width="1.4"/><path d="M219 766.8H231V774.4H219Z" fill="none" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="222.4" y1="770.2" x2="227.6" y2="770.2" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><text x="225" y="789" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" text-anchor="middle" style="letter-spacing:0.08em">ARCHIVE</text><rect x="293" y="747" width="44" height="3" fill="#1B1915"/><circle cx="315" cy="768" r="3.68" fill="none" stroke="#1B1915" stroke-width="1.4"/><line x1="320.409" y1="769.449" x2="322.727" y2="770.071" stroke="#1B1915" stroke-width="1.4" stroke-linecap="round"/><line x1="316.449" y1="773.409" x2="317.071" y2="775.727" stroke="#1B1915" stroke-width="1.4" stroke-linecap="round"/><line x1="311.04" y1="771.96" x2="309.343" y2="773.657" stroke="#1B1915" stroke-width="1.4" stroke-linecap="round"/><line x1="309.591" y1="766.551" x2="307.273" y2="765.929" stroke="#1B1915" stroke-width="1.4" stroke-linecap="round"/><line x1="313.551" y1="762.591" x2="312.929" y2="760.273" stroke="#1B1915" stroke-width="1.4" stroke-linecap="round"/><line x1="318.96" y1="764.04" x2="320.657" y2="762.343" stroke="#1B1915" stroke-width="1.4" stroke-linecap="round"/><text x="315" y="789" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#1B1915" text-anchor="middle" style="letter-spacing:0.08em">SETTINGS</text><text x="12" y="124" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="20" font-weight="700" fill="#1B1915">Settings</text><line x1="0" y1="134.5" x2="360" y2="134.5" stroke="#CBB08E" stroke-width="1"/><text x="12" y="156" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" style="letter-spacing:0.15em">SUGGESTION ENGINE</text><line x1="12" y1="162.5" x2="348" y2="162.5" stroke="#9B6B3F" stroke-width="1"/><rect x="12" y="170" width="336" height="96" fill="#FFFFFF" rx="2" stroke="#CBB08E" stroke-width="1"/><rect x="24.5" y="184.5" width="11" height="11" fill="none" rx="0.8" stroke="#1B1915" stroke-width="1.4"/><line x1="26.8" y1="188.2" x2="33.2" y2="188.2" stroke="#1B1915" stroke-width="1.12"/><line x1="26.8" y1="191.4" x2="33.2" y2="191.4" stroke="#1B1915" stroke-width="1.12"/><line x1="29.8" y1="184.5" x2="29.8" y2="195.5" stroke="#1B1915" stroke-width="1.12"/><text x="46" y="195" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="15" font-weight="700" fill="#1B1915">Rule Engine</text><text x="336" y="194" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#1B1915" text-anchor="end" style="letter-spacing:0.14em">ACTIVE</text><line x1="24" y1="206.5" x2="336" y2="206.5" stroke="#CBB08E" stroke-width="1" opacity="0.8"/><text x="24" y="224" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#1B1915">No API Key is configured.</text><text x="24" y="240" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5C5345">Every suggestion is produced on this device, offline,</text><text x="24" y="253" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5C5345">with no account. This is the normal way to run the app.</text><text x="12" y="288" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" style="letter-spacing:0.15em">API KEY</text><line x1="12" y1="294.5" x2="348" y2="294.5" stroke="#9B6B3F" stroke-width="1"/><rect x="12" y="304" width="246" height="32" fill="#FFFFFF" rx="2" stroke="#CBB08E" stroke-width="1"/><text x="22" y="324.14" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#5C5345">Paste an Anthropic API Key</text><rect x="264" y="304" width="84" height="32" fill="#FFFFFF" rx="2" stroke="#1B1915" stroke-width="1"/><text x="306" y="324.32" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#1B1915" text-anchor="middle">Save</text><text x="12" y="352" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5C5345">Optional. Saving a key does not turn Cloud Suggestions on.</text><text x="12" y="378" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" style="letter-spacing:0.15em">CLOUD SUGGESTIONS</text><line x1="12" y1="384.5" x2="348" y2="384.5" stroke="#9B6B3F" stroke-width="1"/><rect x="12" y="396" width="34" height="18" fill="#FFFFFF" rx="9" stroke="#9B6B3F" stroke-width="1"/><circle cx="21" cy="405" r="5.6" fill="#5C5345"/><text x="54" y="409" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="14" font-weight="700" fill="#1B1915">Off</text><text x="84" y="409" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5C5345">— needs an API Key</text><text x="12" y="432" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#5C5345">Turning this on sends your task text to the Anthropic</text><text x="12" y="445" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#5C5345">API with your own key. The Rule Engine stays the</text><text x="12" y="458" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#5C5345">fallback, and keeps the engine name on every suggestion.</text><text x="12" y="484" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" style="letter-spacing:0.15em">ARCHIVE</text><line x1="12" y1="490.5" x2="348" y2="490.5" stroke="#9B6B3F" stroke-width="1"/><text x="12" y="518" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="500" fill="#1B1915">Archive completed tasks after</text><rect x="222" y="502" width="126" height="26" fill="#FFFFFF" rx="2" stroke="#9B6B3F" stroke-width="1"/><text x="231" y="519.14" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="500" fill="#1B1915">30 days</text><path d="M333.6 513.3L337 516.9L340.4 513.3" fill="none" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="536.5" x2="348" y2="536.5" stroke="#CBB08E" stroke-width="1"/><text x="12" y="554" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5C5345">Settings is the only screen that ever says anything</text><text x="12" y="565" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5C5345">about an engine. Nothing pops up anywhere else.</text></svg>

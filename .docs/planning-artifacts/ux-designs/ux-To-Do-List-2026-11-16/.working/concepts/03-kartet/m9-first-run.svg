<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800"><rect x="0" y="0" width="360" height="800" fill="#FCFBF8"/><rect x="0" y="0" width="360" height="46" fill="#EDE4D3"/><line x1="0" y1="45.5" x2="360" y2="45.5" stroke="#9B6B3F" stroke-width="1"/><text x="14" y="29" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="15" font-weight="700" fill="#1B1915" style="letter-spacing:0.09em">TO-DO-LIST</text><circle cx="336" cy="23" r="3.68" fill="none" stroke="#5C5345" stroke-width="1.4"/><line x1="341.409" y1="24.4494" x2="343.727" y2="25.0706" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><line x1="337.449" y1="28.4092" x2="338.071" y2="30.7274" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><line x1="332.04" y1="26.9598" x2="330.343" y2="28.6569" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><line x1="330.591" y1="21.5506" x2="328.273" y2="20.9294" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><line x1="334.551" y1="17.5908" x2="333.929" y2="15.2726" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><line x1="339.96" y1="19.0402" x2="341.657" y2="17.3431" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><rect x="12" y="58" width="250" height="32" fill="#FFFFFF" rx="2" stroke="#1B1915" stroke-width="1.5"/><text x="22" y="78.32" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5C5345">Type a task the way you say it</text><line x1="22" y1="67.28" x2="22" y2="80.24" stroke="#1B1915" stroke-width="1.4"/><rect x="270" y="58" width="78" height="32" fill="#1B1915" rx="2" stroke="#1B1915" stroke-width="1"/><text x="309" y="78.5" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Add</text><line x1="0" y1="99.5" x2="360" y2="99.5" stroke="#CBB08E" stroke-width="1"/><rect x="0" y="746" width="360" height="54" fill="#EDE4D3"/><line x1="0" y1="746.5" x2="360" y2="746.5" stroke="#9B6B3F" stroke-width="1"/><rect x="23" y="747" width="44" height="3" fill="#1B1915"/><circle cx="39" cy="763.6" r="1.25" fill="#1B1915"/><line x1="42.6" y1="763.6" x2="52" y2="763.6" stroke="#1B1915" stroke-width="1.4" stroke-linecap="round"/><circle cx="39" cy="768" r="1.25" fill="#1B1915"/><line x1="42.6" y1="768" x2="52" y2="768" stroke="#1B1915" stroke-width="1.4" stroke-linecap="round"/><circle cx="39" cy="772.4" r="1.25" fill="#1B1915"/><line x1="42.6" y1="772.4" x2="52" y2="772.4" stroke="#1B1915" stroke-width="1.4" stroke-linecap="round"/><text x="45" y="789" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#1B1915" text-anchor="middle" style="letter-spacing:0.08em">TODAY</text><rect x="129.5" y="763.5" width="11" height="9" fill="none" rx="0.8" stroke="#5C5345" stroke-width="1.4"/><line x1="133.2" y1="763.5" x2="133.2" y2="772.5" stroke="#5C5345" stroke-width="1.12"/><line x1="136.8" y1="763.5" x2="136.8" y2="772.5" stroke="#5C5345" stroke-width="1.12"/><text x="135" y="789" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" text-anchor="middle" style="letter-spacing:0.08em">LISTS</text><rect x="217.5" y="761.6" width="15" height="4.4" fill="none" rx="1" stroke="#5C5345" stroke-width="1.4"/><path d="M219 766.8H231V774.4H219Z" fill="none" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="222.4" y1="770.2" x2="227.6" y2="770.2" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><text x="225" y="789" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" text-anchor="middle" style="letter-spacing:0.08em">ARCHIVE</text><circle cx="315" cy="768" r="3.68" fill="none" stroke="#5C5345" stroke-width="1.4"/><line x1="320.409" y1="769.449" x2="322.727" y2="770.071" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><line x1="316.449" y1="773.409" x2="317.071" y2="775.727" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><line x1="311.04" y1="771.96" x2="309.343" y2="773.657" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><line x1="309.591" y1="766.551" x2="307.273" y2="765.929" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><line x1="313.551" y1="762.591" x2="312.929" y2="760.273" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><line x1="318.96" y1="764.04" x2="320.657" y2="762.343" stroke="#5C5345" stroke-width="1.4" stroke-linecap="round"/><text x="315" y="789" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" text-anchor="middle" style="letter-spacing:0.08em">SETTINGS</text><text x="12" y="128" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="21" font-weight="700" fill="#1B1915">Nothing here yet</text><text x="12" y="150" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5C5345">Type a task the way you would say it out loud. It is saved</text><text x="12" y="164" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5C5345">the moment you add it — before anything is proposed.</text><line x1="12" y1="178.5" x2="348" y2="178.5" stroke="#9B6B3F" stroke-width="1"/><text x="12" y="196" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#8E2E7E" style="letter-spacing:0.14em">THEN THREE CONTROLS ARRIVE IN PURPLE</text><circle cx="26" cy="222" r="11" fill="#FFFFFF" stroke="#8E2E7E" stroke-width="1.8"/><text x="26" y="226.2" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="12" font-weight="700" fill="#8E2E7E" text-anchor="middle">1</text><line x1="26" y1="235" x2="26" y2="243" stroke="#8E2E7E" stroke-width="1.5"/><text x="46" y="221" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1B1915">Tags</text><text x="46" y="234" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5C5345">which of your contexts it belongs to</text><circle cx="26" cy="256" r="11" fill="#FFFFFF" stroke="#8E2E7E" stroke-width="1.8"/><text x="26" y="260.2" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="12" font-weight="700" fill="#8E2E7E" text-anchor="middle">2</text><line x1="26" y1="269" x2="26" y2="277" stroke="#8E2E7E" stroke-width="1.5"/><text x="46" y="255" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1B1915">Priority</text><text x="46" y="268" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5C5345">high, medium or low</text><circle cx="26" cy="290" r="11" fill="#FFFFFF" stroke="#8E2E7E" stroke-width="1.8"/><text x="26" y="294.2" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="12" font-weight="700" fill="#8E2E7E" text-anchor="middle">3</text><text x="46" y="289" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1B1915">Summary</text><text x="46" y="302" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5C5345">a short version of your own sentence</text><text x="46" y="318" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="500" fill="#5C5345">You punch each one on its own — accept, edit or reject.</text><text x="46" y="329" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="500" fill="#5C5345">Purple means proposed. Nothing purple is yours yet.</text><line x1="12" y1="344.5" x2="348" y2="344.5" stroke="#9B6B3F" stroke-width="1"/><text x="12" y="362" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" style="letter-spacing:0.14em">THE LISTS YOU NEVER BUILD</text><rect x="14" y="378" width="9" height="9" fill="#F2CB5A" rx="1" stroke="#9B6B3F" stroke-width="0.9"/><text x="32" y="387" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#1B1915">Due this week</text><text x="348" y="387" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="12" font-weight="700" fill="#5C5345" text-anchor="end" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1">0</text><line x1="12" y1="397.5" x2="348" y2="397.5" stroke="#CBB08E" stroke-width="1" opacity="0.5"/><rect x="14" y="406" width="9" height="9" fill="#4E7033" rx="1" stroke="#4E7033" stroke-width="0.9"/><text x="32" y="415" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#1B1915">Need Attention</text><text x="348" y="415" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="12" font-weight="700" fill="#5C5345" text-anchor="end" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1">0</text><line x1="12" y1="425.5" x2="348" y2="425.5" stroke="#CBB08E" stroke-width="1" opacity="0.5"/><rect x="14" y="434" width="9" height="9" fill="#EDE4D3" rx="1" stroke="#9B6B3F" stroke-width="0.9"/><text x="32" y="443" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#1B1915">High priority</text><text x="348" y="443" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="12" font-weight="700" fill="#5C5345" text-anchor="end" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1">0</text><line x1="12" y1="453.5" x2="348" y2="453.5" stroke="#CBB08E" stroke-width="1" opacity="0.5"/><text x="12" y="472" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5C5345">They fill themselves from your due dates and priorities.</text><line x1="12" y1="484.5" x2="348" y2="484.5" stroke="#CBB08E" stroke-width="1"/><rect x="12" y="495.27" width="11" height="11" fill="none" rx="0.8" stroke="#5C5345" stroke-width="1.2"/><line x1="14.3" y1="498.97" x2="20.7" y2="498.97" stroke="#5C5345" stroke-width="0.96"/><line x1="14.3" y1="502.17" x2="20.7" y2="502.17" stroke="#5C5345" stroke-width="0.96"/><line x1="17.3" y1="495.27" x2="17.3" y2="506.27" stroke="#5C5345" stroke-width="0.96"/><text x="28" y="504" font-family="'Barlow Condensed','Archivo Narrow','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" style="letter-spacing:0.1em">RULE ENGINE</text><text x="12" y="522" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5C5345">Works offline, with no key and no account. The Rule Engine</text><text x="12" y="533" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5C5345">makes the suggestions, and says so on every one.</text></svg>

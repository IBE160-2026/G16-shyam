<text x="604" y="208" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#17171A" text-anchor="start" letter-spacing="0.72" style="" xml:space="preserve">NOTHING ABOUT THE APP HAS CHANGED</text>
<line x1="224" y1="224.5" x2="924" y2="224.5" stroke="#17171A" stroke-width="1"/>
<text x="224" y="264" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#A6261C" text-anchor="start" letter-spacing="1.54" style="" xml:space="preserve">WHY</text>
<line x1="224" y1="272.5" x2="924" y2="272.5" stroke="#17171A" stroke-width="1"/>
<text x="224" y="302" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">This key’s organization does not permit API calls from a browser. The key itself is valid, and</text>
<text x="224" y="328" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">nothing you change about it will alter this.</text>
<text x="224" y="366" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#17171A" text-anchor="start" letter-spacing="1.00" style="" xml:space="preserve">WHAT HELPS: NOTHING · THIS IS NOT A FAULT IN YOUR KEY</text>
<line x1="224" y1="382.5" x2="924" y2="382.5" stroke="#17171A" stroke-width="1"/>
<text x="224" y="412" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#A6261C" text-anchor="start" letter-spacing="1.54" style="" xml:space="preserve">THE OTHER TWO REASONS THIS LINE CAN READ</text>
<line x1="224" y1="420.5" x2="924" y2="420.5" stroke="#17171A" stroke-width="1"/>
<text x="224" y="448" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#17171A" text-anchor="start" letter-spacing="1.20" style="" xml:space="preserve">KEY REJECTED</text>
<text x="224" y="478" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">The API Key was rejected. Check it, or paste a new</text>
<text x="224" y="500" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">one.</text>
<text x="224" y="534" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#17171A" text-anchor="start" letter-spacing="0.72" style="" xml:space="preserve">WHAT HELPS: A VALID KEY</text>
<text x="604" y="448" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#17171A" text-anchor="start" letter-spacing="1.20" style="" xml:space="preserve">CREDIT USED UP</text>
<text x="604" y="478" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">The key’s credit or quota is used up. The key is fine;</text>
<text x="604" y="500" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">it has nothing left to spend.</text>
<text x="604" y="534" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#17171A" text-anchor="start" letter-spacing="0.72" style="" xml:space="preserve">WHAT HELPS: ADD CREDIT TO THE ACCOUNT</text>
<line x1="224" y1="556.5" x2="924" y2="556.5" stroke="#17171A" stroke-width="1"/>
<text x="224" y="582" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#17171A" text-anchor="start" letter-spacing="0.72" style="" xml:space="preserve">THE THREE READ DIFFERENTLY ON PURPOSE: ONE IS A BAD KEY, ONE IS AN EMPTY ACCOUNT, AND ONE IS NOT YOUR KEY AT ALL.</text>
<text x="972" y="100" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#A6261C" text-anchor="start" letter-spacing="1.54" style="" xml:space="preserve">WHERE THIS APPEARS</text>
<line x1="972" y1="108.5" x2="1240" y2="108.5" stroke="#17171A" stroke-width="1"/>
<text x="972" y="132" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">Only here. Capture and review showed nothing at</text>
<text x="972" y="152" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">all: every failed cloud call fell back to the Rule</text>
<text x="972" y="172" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">Engine without a word.</text>
<text x="972" y="234" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#A6261C" text-anchor="start" letter-spacing="1.54" style="" xml:space="preserve">NOT AN ERROR</text>
<line x1="972" y1="242.5" x2="1240" y2="242.5" stroke="#17171A" stroke-width="1"/>
<text x="972" y="266" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">The product has not changed character. The free,</text>
<text x="972" y="286" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">on-device path is the one it was always built on.</text>

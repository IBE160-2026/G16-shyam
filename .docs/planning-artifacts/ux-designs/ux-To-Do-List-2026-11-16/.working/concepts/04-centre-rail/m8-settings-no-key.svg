<rect x="34.5" y="546.5" width="12" height="12" fill="#F2EDE3" stroke="#17171A" stroke-width="1"/>
<text x="56" y="559" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">Cloud Suggestions</text>
<text x="340" y="559" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#17171A" text-anchor="end" letter-spacing="1.00" style="" xml:space="preserve">OFF</text>
<text x="34" y="588" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">Turning this on sends your task text to the</text>
<text x="34" y="609" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">Anthropic API with your own key. The Rule Engine</text>
<text x="34" y="630" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">stays the fallback.</text>
<text x="34" y="672" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#17171A" text-anchor="start" letter-spacing="0.72" style="" xml:space="preserve">OFF ON FIRST RUN EVEN IF A KEY IS PRESENT</text>

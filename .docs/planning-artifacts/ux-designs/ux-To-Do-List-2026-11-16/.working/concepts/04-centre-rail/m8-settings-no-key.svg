<text x="34" y="486" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#17171A" text-anchor="start" letter-spacing="0.72" style="" xml:space="preserve">NEVER SENT ANYWHERE UNTIL YOU TURN CLOUD</text>
<text x="34" y="500" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#17171A" text-anchor="start" letter-spacing="0.72" style="" xml:space="preserve">SUGGESTIONS ON.</text>
<text x="34" y="522" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#A6261C" text-anchor="start" letter-spacing="1.54" style="" xml:space="preserve">CLOUD SUGGESTIONS</text>

<text x="34" y="286" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">No API Key is configured. Every suggestion here</text>
<text x="34" y="309" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">comes from the Rule Engine, on this device.</text>
<text x="34" y="332" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#17171A" text-anchor="start" style="" xml:space="preserve">That is the normal state, not a limitation.</text>
<text x="34" y="398" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#A6261C" text-anchor="start" letter-spacing="1.54" style="" xml:space="preserve">API KEY</text>

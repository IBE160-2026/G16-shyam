<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800">
<rect width="360" height="800" fill="#FFFFFF"/>
<rect x="0" y="0" width="360" height="28" fill="#FFFFFF"/><rect x="8" y="6" width="79" height="16" fill="#CC1122"/><text x="15" y="17.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" style="letter-spacing:0.08em">TO-DO-LIST</text><text x="352" y="18" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="500" fill="#5F646B" text-anchor="end" style="font-variant-numeric:tabular-nums">Mon 16 Nov</text><line x1="0" y1="28.5" x2="360" y2="28.5" stroke="#D2D6DB" stroke-width="1"/><text x="45" y="45" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="11" font-weight="500" fill="#5F646B" text-anchor="middle" style="letter-spacing:0.06em">TODAY</text><line x1="90.5" y1="31" x2="90.5" y2="51" stroke="#E4E7EA" stroke-width="1"/><text x="135" y="45" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="11" font-weight="500" fill="#5F646B" text-anchor="middle" style="letter-spacing:0.06em">LISTS</text><line x1="180.5" y1="31" x2="180.5" y2="51" stroke="#E4E7EA" stroke-width="1"/><text x="225" y="45" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="11" font-weight="500" fill="#5F646B" text-anchor="middle" style="letter-spacing:0.06em">ARCHIVE</text><line x1="270.5" y1="31" x2="270.5" y2="51" stroke="#E4E7EA" stroke-width="1"/><text x="315" y="45" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="11" font-weight="700" fill="#15171A" text-anchor="middle" style="letter-spacing:0.06em">SETTINGS</text><rect x="270" y="51.5" width="90" height="2.5" fill="#CC1122"/><line x1="0" y1="54.5" x2="360" y2="54.5" stroke="#D2D6DB" stroke-width="1"/><rect x="8.5" y="62.5" width="343" height="101" fill="#FFFFFF" stroke="#D2D6DB" stroke-width="1"/><rect x="9" y="63" width="342" height="17" fill="#F2F4F6"/><rect x="9" y="63" width="59.75" height="17" fill="#15171A"/><text x="17" y="74.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" style="letter-spacing:0.08em">API KEY</text><line x1="9" y1="80.5" x2="351" y2="80.5" stroke="#D2D6DB" stroke-width="1"/><text x="344" y="74.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="500" fill="#5F646B" text-anchor="end" style="letter-spacing:0.04em;font-variant-numeric:tabular-nums">NONE SAVED</text><text x="17" y="95" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="450" fill="#5F646B">Optional. The app does not need one.</text><rect x="17.5" y="102.5" width="255" height="29" fill="#FFFFFF" stroke="#15171A" stroke-width="1"/><text x="26" y="121.32" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5F646B">No key saved</text><rect x="279.5" y="102.5" width="63" height="29" fill="#FFFFFF" stroke="#B9BEC6" stroke-width="1"/><text x="299.67" y="120.96" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#15171A">Save</text><text x="17" y="150" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="450" fill="#5F646B">Stored on this device only, and never in the repository.</text><rect x="8.5" y="170.5" width="343" height="147" fill="#FFFFFF" stroke="#D2D6DB" stroke-width="1"/><rect x="9" y="171" width="342" height="17" fill="#F2F4F6"/><rect x="9" y="171" width="122.25" height="17" fill="#15171A"/><text x="17" y="182.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" style="letter-spacing:0.08em">CLOUD SUGGESTIONS</text><line x1="9" y1="188.5" x2="351" y2="188.5" stroke="#D2D6DB" stroke-width="1"/><text x="344" y="182.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="500" fill="#5F646B" text-anchor="end" style="letter-spacing:0.04em;font-variant-numeric:tabular-nums">OFF</text><rect x="17.5" y="196.5" width="33" height="17" fill="#F2F4F6" stroke="#B9BEC6" stroke-width="1" rx="9.0"/><circle cx="26" cy="205" r="7" fill="#FFFFFF" stroke="#B9BEC6" stroke-width="1"/><text x="59" y="209" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#15171A">Off</text><text x="343" y="209" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10.5" font-weight="600" fill="#5F646B" text-anchor="end" style="letter-spacing:0.02em">no key saved</text><line x1="9" y1="222.5" x2="351" y2="222.5" stroke="#E4E7EA" stroke-width="1"/><text x="17" y="240" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="450" fill="#5F646B">Turning this on sends your task text to the Anthropic API.</text><text x="17" y="258" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="450" fill="#5F646B">The key would be your own, kept on this device.</text><text x="17" y="276" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="450" fill="#5F646B">The Rule Engine stays the fallback, online or off.</text><text x="17" y="294" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="450" fill="#5F646B">Saving a key never turns this on by itself.</text><rect x="8.5" y="324.5" width="343" height="117" fill="#FFFFFF" stroke="#D2D6DB" stroke-width="1"/><rect x="9" y="325" width="342" height="17" fill="#F2F4F6"/><rect x="9" y="325" width="122.25" height="17" fill="#15171A"/><text x="17" y="336.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" style="letter-spacing:0.08em">SUGGESTION ENGINE</text><line x1="9" y1="342.5" x2="351" y2="342.5" stroke="#D2D6DB" stroke-width="1"/><text x="344" y="336.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="500" fill="#5F646B" text-anchor="end" style="letter-spacing:0.04em;font-variant-numeric:tabular-nums">RULE ENGINE</text><text x="17" y="358" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#15171A">The Rule Engine is serving suggestions.</text><line x1="9" y1="366.5" x2="351" y2="366.5" stroke="#E4E7EA" stroke-width="1"/><text x="17" y="382" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="450" fill="#5F646B">No API Key is configured.</text><line x1="9" y1="390.5" x2="351" y2="390.5" stroke="#E4E7EA" stroke-width="1"/><text x="17" y="406" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="450" fill="#5F646B">It runs on this device, with no network.</text><line x1="9" y1="414.5" x2="351" y2="414.5" stroke="#E4E7EA" stroke-width="1"/><text x="17" y="430" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="450" fill="#5F646B">Nothing here needs fixing.</text><rect x="8.5" y="448.5" width="343" height="139" fill="#FFFFFF" stroke="#D2D6DB" stroke-width="1"/><rect x="9" y="449" width="342" height="17" fill="#F2F4F6"/><rect x="9" y="449" width="66" height="17" fill="#15171A"/><text x="17" y="460.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" style="letter-spacing:0.08em">SETTINGS</text><line x1="9" y1="466.5" x2="351" y2="466.5" stroke="#D2D6DB" stroke-width="1"/><text x="17" y="485" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="450" fill="#15171A">Archive retention</text><rect x="243.5" y="470.5" width="99" height="21" fill="#FFFFFF" stroke="#15171A" stroke-width="1"/><text x="252" y="484.78" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="500" fill="#15171A" style="font-variant-numeric:tabular-nums">30 days</text><path d="M 325 479.5 L 328 482.5 L 331 479.5" fill="none" stroke="#15171A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><line x1="314.5" y1="471" x2="314.5" y2="491" stroke="#D2D6DB" stroke-width="1"/><line x1="9" y1="496.5" x2="351" y2="496.5" stroke="#E4E7EA" stroke-width="1"/><text x="17" y="515" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="450" fill="#15171A">Install this app</text><rect x="271.5" y="500.5" width="71" height="21" fill="#FFFFFF" stroke="#B9BEC6" stroke-width="1"/><text x="288.07" y="514.78" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#15171A">Install</text><line x1="9" y1="526.5" x2="351" y2="526.5" stroke="#E4E7EA" stroke-width="1"/><text x="17" y="545" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="450" fill="#15171A">Task text</text><text x="343" y="545" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10.5" font-weight="600" fill="#5F646B" text-anchor="end" style="letter-spacing:0.02em">English only, by decision</text><line x1="9" y1="556.5" x2="351" y2="556.5" stroke="#E4E7EA" stroke-width="1"/><text x="17" y="575" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="450" fill="#15171A">Interface language</text><text x="343" y="575" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10.5" font-weight="600" fill="#5F646B" text-anchor="end" style="letter-spacing:0.02em">English — not yet decided</text><rect x="8.5" y="594.5" width="343" height="72" fill="#FFFFFF" stroke="#D2D6DB" stroke-width="1"/><rect x="9" y="595" width="342" height="17" fill="#F2F4F6"/><rect x="9" y="595" width="84.75" height="17" fill="#15171A"/><text x="17" y="606.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" style="letter-spacing:0.08em">TWO ENGINES</text><line x1="9" y1="612.5" x2="351" y2="612.5" stroke="#D2D6DB" stroke-width="1"/><text x="17" y="627" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="450" fill="#5F646B">Rule Engine — keyword tables on this device. No key, no network.</text><text x="17" y="642" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="450" fill="#5F646B">Model Engine — the Anthropic API, opt in, your own key.</text><text x="17" y="657" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="450" fill="#5F646B">Either way you see which one proposed what, and you decide.</text>
</svg>

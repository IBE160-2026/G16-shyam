<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800">
<rect width="360" height="800" fill="#FFFFFF"/>
<rect x="0" y="0" width="360" height="28" fill="#FFFFFF"/><rect x="8" y="6" width="79" height="16" fill="#CC1122"/><text x="15" y="17.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" style="letter-spacing:0.08em">TO-DO-LIST</text><text x="352" y="18" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="500" fill="#5F646B" text-anchor="end" style="font-variant-numeric:tabular-nums">Mon 16 Nov</text><line x1="0" y1="28.5" x2="360" y2="28.5" stroke="#D2D6DB" stroke-width="1"/><text x="45" y="45" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="11" font-weight="700" fill="#15171A" text-anchor="middle" style="letter-spacing:0.06em">TODAY</text><rect x="0" y="51.5" width="90" height="2.5" fill="#CC1122"/><line x1="90.5" y1="31" x2="90.5" y2="51" stroke="#E4E7EA" stroke-width="1"/><text x="135" y="45" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="11" font-weight="500" fill="#5F646B" text-anchor="middle" style="letter-spacing:0.06em">LISTS</text><line x1="180.5" y1="31" x2="180.5" y2="51" stroke="#E4E7EA" stroke-width="1"/><text x="225" y="45" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="11" font-weight="500" fill="#5F646B" text-anchor="middle" style="letter-spacing:0.06em">ARCHIVE</text><line x1="270.5" y1="31" x2="270.5" y2="51" stroke="#E4E7EA" stroke-width="1"/><text x="315" y="45" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="11" font-weight="500" fill="#5F646B" text-anchor="middle" style="letter-spacing:0.06em">SETTINGS</text><line x1="0" y1="54.5" x2="360" y2="54.5" stroke="#D2D6DB" stroke-width="1"/><rect x="8.5" y="62.5" width="343" height="57" fill="#FFFFFF" stroke="#D2D6DB" stroke-width="1"/><rect x="9" y="63" width="342" height="17" fill="#F2F4F6"/><rect x="9" y="63" width="59.75" height="17" fill="#CC1122"/><text x="17" y="74.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" style="letter-spacing:0.08em">CAPTURE</text><line x1="9" y1="80.5" x2="351" y2="80.5" stroke="#D2D6DB" stroke-width="1"/><text x="344" y="74.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="500" fill="#5F646B" text-anchor="end" style="letter-spacing:0.04em;font-variant-numeric:tabular-nums">START HERE</text><rect x="14.5" y="81.5" width="267" height="33" fill="none" stroke="#CC1122" stroke-width="2"/><rect x="17.5" y="84.5" width="261" height="27" fill="#FFFFFF" stroke="#15171A" stroke-width="1"/><text x="26" y="102.32" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5F646B">Submit assignment in IBE160 Friday</text><rect x="285.5" y="84.5" width="57" height="27" fill="#CC1122" stroke="#CC1122" stroke-width="1"/><path d="M 303.5 94.6 L 303.5 101.4 M 300.1 98 L 306.9 98" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="312.5" y="101.96" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Add</text><rect x="8.5" y="126.5" width="343" height="163" fill="#FFFFFF" stroke="#D2D6DB" stroke-width="1"/><rect x="9" y="127" width="342" height="17" fill="#F2F4F6"/><rect x="9" y="127" width="103.5" height="17" fill="#CC1122"/><text x="17" y="138.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" style="letter-spacing:0.08em">HOW THIS WORKS</text><line x1="9" y1="144.5" x2="351" y2="144.5" stroke="#D2D6DB" stroke-width="1"/><path d="M 18.5 163 L 25.5 163 M 22.8 160.3 L 25.5 163 L 22.8 165.7" fill="none" stroke="#15171A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="164" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#15171A">You type one sentence.</text><text x="35" y="180" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="450" fill="#5F646B">It is saved before anything is proposed.</text><line x1="9" y1="192.5" x2="351" y2="192.5" stroke="#E4E7EA" stroke-width="1"/><path d="M 18.5 211 L 25.5 211 M 22.8 208.3 L 25.5 211 L 22.8 213.7" fill="none" stroke="#15171A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="212" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#15171A">An engine proposes three parts.</text><text x="35" y="228" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="450" fill="#5F646B">Tags, Priority and a Summary — separately.</text><line x1="9" y1="240.5" x2="351" y2="240.5" stroke="#E4E7EA" stroke-width="1"/><path d="M 18.5 259 L 25.5 259 M 22.8 256.3 L 25.5 259 L 22.8 261.7" fill="none" stroke="#15171A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="260" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#15171A">You accept, edit or reject each.</text><text x="35" y="276" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="450" fill="#5F646B">Nothing is filed until you do.</text><rect x="8.5" y="296.5" width="343" height="127" fill="#FFFFFF" stroke="#D2D6DB" stroke-width="1"/><rect x="9" y="297" width="342" height="17" fill="#F2F4F6"/><rect x="9" y="297" width="84.75" height="17" fill="#15171A"/><text x="17" y="308.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" style="letter-spacing:0.08em">SMART LISTS</text><line x1="9" y1="314.5" x2="351" y2="314.5" stroke="#D2D6DB" stroke-width="1"/><text x="344" y="308.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="500" fill="#5F646B" text-anchor="end" style="letter-spacing:0.04em;font-variant-numeric:tabular-nums">NOTHING FILED YET</text><text x="17" y="332.2" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="450" fill="#15171A">Due this week</text><rect x="310.88" y="321" width="14.62" height="14" fill="#F2F4F6" stroke="#B9BEC6" stroke-width="1"/><text x="318.19" y="331.7" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#15171A" text-anchor="middle" style="font-variant-numeric:tabular-nums">0</text><path d="M 335.4 325.2 L 338.8 328 L 335.4 330.8" fill="none" stroke="#5F646B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><line x1="9" y1="342.5" x2="351" y2="342.5" stroke="#E4E7EA" stroke-width="1"/><text x="17" y="360.2" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="450" fill="#15171A">Need Attention</text><rect x="310.88" y="349" width="14.62" height="14" fill="#F2F4F6" stroke="#B9BEC6" stroke-width="1"/><text x="318.19" y="359.7" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#15171A" text-anchor="middle" style="font-variant-numeric:tabular-nums">0</text><path d="M 335.4 353.2 L 338.8 356 L 335.4 358.8" fill="none" stroke="#5F646B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><line x1="9" y1="370.5" x2="351" y2="370.5" stroke="#E4E7EA" stroke-width="1"/><text x="17" y="388.2" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="450" fill="#15171A">High priority</text><rect x="310.88" y="377" width="14.62" height="14" fill="#F2F4F6" stroke="#B9BEC6" stroke-width="1"/><text x="318.19" y="387.7" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#15171A" text-anchor="middle" style="font-variant-numeric:tabular-nums">0</text><path d="M 335.4 381.2 L 338.8 384 L 335.4 386.8" fill="none" stroke="#5F646B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><line x1="9" y1="398.5" x2="351" y2="398.5" stroke="#E4E7EA" stroke-width="1"/><rect x="9" y="398" width="342" height="23" fill="#F2F4F6"/><text x="17" y="413" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="600" fill="#5F646B" style="letter-spacing:0.02em;font-variant-numeric:tabular-nums">These are derived. They fill themselves as tasks arrive.</text><rect x="8.5" y="430.5" width="343" height="93" fill="#FFFFFF" stroke="#D2D6DB" stroke-width="1"/><rect x="9" y="431" width="342" height="17" fill="#F2F4F6"/><rect x="9" y="431" width="122.25" height="17" fill="#15171A"/><text x="17" y="442.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" style="letter-spacing:0.08em">SUGGESTION ENGINE</text><line x1="9" y1="448.5" x2="351" y2="448.5" stroke="#D2D6DB" stroke-width="1"/><text x="344" y="442.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="500" fill="#5F646B" text-anchor="end" style="letter-spacing:0.04em;font-variant-numeric:tabular-nums">READY</text><text x="17" y="464" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#15171A">The Rule Engine is serving suggestions.</text><line x1="9" y1="472.5" x2="351" y2="472.5" stroke="#E4E7EA" stroke-width="1"/><text x="17" y="488" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="450" fill="#5F646B">No API Key, no account and no network needed.</text><line x1="9" y1="496.5" x2="351" y2="496.5" stroke="#E4E7EA" stroke-width="1"/><text x="17" y="512" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="450" fill="#5F646B">An Anthropic key is optional, and off until you say so.</text><rect x="8.5" y="530.5" width="343" height="69" fill="#FFFFFF" stroke="#D2D6DB" stroke-width="1"/><rect x="9" y="531" width="342" height="17" fill="#F2F4F6"/><rect x="9" y="531" width="53.5" height="17" fill="#15171A"/><text x="17" y="542.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" style="letter-spacing:0.08em">TRY IT</text><line x1="9" y1="548.5" x2="351" y2="548.5" stroke="#D2D6DB" stroke-width="1"/><text x="17" y="564" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#15171A">Submit assignment in IBE160 Friday</text><rect x="17.5" y="572.5" width="135" height="21" fill="#FFFFFF" stroke="#B9BEC6" stroke-width="1"/><text x="41.74" y="586.78" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#15171A">Use this example</text><text x="161" y="587" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="600" fill="#5F646B" style="letter-spacing:0.02em">tags it school, high, Fri 20 Nov</text><rect x="8.5" y="606.5" width="343" height="57" fill="#FFFFFF" stroke="#D2D6DB" stroke-width="1"/><rect x="9" y="607" width="342" height="17" fill="#F2F4F6"/><rect x="9" y="607" width="72.25" height="17" fill="#15171A"/><text x="17" y="618.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" style="letter-spacing:0.08em">TAG LISTS</text><line x1="9" y1="624.5" x2="351" y2="624.5" stroke="#D2D6DB" stroke-width="1"/><text x="17" y="639" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="450" fill="#5F646B">A list appears for each tag as soon as a tag is in use.</text><text x="17" y="654" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="450" fill="#5F646B">You never build or maintain a view by hand.</text><rect x="8.5" y="670.5" width="343" height="57" fill="#FFFFFF" stroke="#D2D6DB" stroke-width="1"/><rect x="9" y="671" width="342" height="17" fill="#F2F4F6"/><rect x="9" y="671" width="59.75" height="17" fill="#15171A"/><text x="17" y="682.5" font-family="'Encode Sans Semi Condensed','Archivo','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" style="letter-spacing:0.08em">OFFLINE</text><line x1="9" y1="688.5" x2="351" y2="688.5" stroke="#D2D6DB" stroke-width="1"/><text x="17" y="703" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="450" fill="#5F646B">Everything above works with no network.</text><text x="17" y="718" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="450" fill="#5F646B">There is nothing to sign in to and nothing to sync.</text>
</svg>

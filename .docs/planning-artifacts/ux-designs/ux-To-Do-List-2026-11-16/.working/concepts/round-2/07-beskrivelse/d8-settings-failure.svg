ns-serif" font-size="10" font-weight="700" fill="#5C5345" text-anchor="end" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">1</text><text x="22" y="294" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#1B1915" style="font-variant-numeric:tabular-nums">personal</text><text x="176" y="294" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#5C5345" text-anchor="end" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">4</text><line x1="20" y1="324" x2="176" y2="324" stroke="#CBB08E" stroke-width="1"/><rect x="150" y="336" width="7" height="7" fill="#6BA3D6"/><text x="22" y="349" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#1B1915" style="font-variant-numeric:tabular-nums">Archive</text><text x="176" y="349" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#5C5345" text-anchor="end" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">4</text><rect x="10" y="360" width="176" height="24" fill="#FCFBF8"/><rect x="10" y="360" width="2.6" height="24" fill="#1B1915"/><text x="22" y="376" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1B1915" style="font-variant-numeric:tabular-nums">Settings</text><line x1="20" y1="726" x2="176" y2="726" stroke="#CBB08E" stroke-width="1"/><rect x="20" y="738" width="10" height="10" fill="none" stroke="#5C5345" stroke-width="1"/><text x="25" y="745.4" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="7.5" font-weight="700" fill="#5C5345" text-anchor="middle" style="font-variant-numeric:tabular-nums">R</text><text x="34" y="746" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">RULE ENGINE</text><text x="20" y="762" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">ON DEVICE · NO NETWORK</text><text x="20" y="774" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">NO ACCOUNT · NO KEY</text><text x="222" y="32" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="16" font-weight="700" fill="#1B1915" letter-spacing="1.2" style="font-variant-numeric:tabular-nums">SETTINGS</text><text x="1254" y="32" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" text-anchor="end" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">MON 16 NOV 2026</text><line x1="222" y1="44" x2="1254" y2="44" stroke="#9B6B3F" stroke-width="1.2"/><text x="222" y="60" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">ONE DEVICE · NO ACCOUNT · NOTHING LEAVES WITHOUT CONSENT</text><text x="230" y="81" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" letter-spacing="0.9" style="font-variant-numeric:tabular-nums">API KEY</text><text x="718.0" y="81" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" text-anchor="end" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">SAVED ON THIS DEVICE</text><line x1="222" y1="88" x2="726.0" y2="88" stroke="#CBB08E" stroke-width="1.2"/><rect x="228" y="98" width="386.0" height="28" fill="#FFFFFF"/><rect x="228" y="98" width="386.0" height="28" fill="none" stroke="#5C5345" stroke-width="1"/><text x="238" y="116.0" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#1B1915" style="font-variant-numeric:tabular-nums">sk-ant-api03-••••••••••••••••7Q4F</text><rect x="624.0" y="98" width="96" height="28" fill="#FFFFFF"/><rect x="624.0" y="98" width="96" height="28" fill="none" stroke="#5C5345" stroke-width="1"/><text x="672.0" y="115.6" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#1B1915" text-anchor="middle" letter-spacing="0.7" style="font-variant-numeric:tabular-nums">REPLACE</text><text x="228" y="142" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">STORED IN THIS BROWSER ONLY. NEVER COMMITTED TO THE REPOSITORY, AND NEVER</text><text x="228" y="154" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">SENT ANYWHERE UNTIL CLOUD SUGGESTIONS IS ON.</text><text x="758.0" y="81" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" letter-spacing="0.9" style="font-variant-numeric:tabular-nums">CLOUD SUGGESTIONS</text><text x="1246.0" y="81" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" text-anchor="end" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">ON</text><line x1="750.0" y1="88" x2="1254.0" y2="88" stroke="#CBB08E" stroke-width="1.2"/><rect x="756.0" y="100" width="36" height="18" fill="#1B1915" rx="9.0"/><circle cx="783.0" cy="109.0" r="6.4" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="802.0" y="113" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="500" fill="#1B1915" style="font-variant-numeric:tabular-nums">Use Cloud Suggestions</text><text x="802.0" y="128" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">STILL ON. IT IS THE ORGANIZATION THAT REFUSES, NOT THE SWITCH.</text><text x="756.0" y="148" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">TURNING IT OFF STOPS EVERY OUTBOUND CALL IMMEDIATELY.</text><text x="230" y="209" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" letter-spacing="0.9" style="font-variant-numeric:tabular-nums">SUGGESTION ENGINE</text><line x1="222" y1="216" x2="1254" y2="216" stroke="#CBB08E" stroke-width="1.2"/><rect x="222" y="216" width="2.4" height="96" fill="#1F5878"/><rect x="234" y="230" width="10" height="10" fill="none" stroke="#1F5878" stroke-width="1"/><text x="239" y="237.4" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="7.5" font-weight="700" fill="#1F5878" text-anchor="middle" style="font-variant-numeric:tabular-nums">M</text><text x="248" y="238" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="11" font-weight="700" fill="#1F5878" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">MODEL ENGINE</text><rect x="1104" y="224" width="142" height="18" fill="#E2EEF7"/><text x="1175" y="237" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#1F5878" text-anchor="middle" letter-spacing="0.7" style="font-variant-numeric:tabular-nums">NOT BEING USED</text><text x="234" y="262" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="500" fill="#1B1915" style="font-variant-numeric:tabular-nums">This key’s organization does not permit calls from a browser.</text><text x="234" y="278" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">THE KEY ITSELF IS VALID. REPLACING IT, OR PASTING A NEW ONE, WILL NOT CHANGE T</text><text x="234" y="290" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">HIS — THE RESTRICTION BELONGS TO THE ORGANIZATION, NOT TO YOUR KEY.</text><line x1="234" y1="298" x2="1242" y2="298" stroke="#CBB08E" stroke-width="1"/><rect x="234" y="308" width="10" height="10" fill="none" stroke="#5C5345" stroke-width="1"/><text x="239" y="315.4" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="7.5" font-weight="700" fill="#5C5345" text-anchor="middle" style="font-variant-numeric:tabular-nums">R</text><text x="248" y="316" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">RULE ENGINE</text><text x="326" y="316" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#1B1915" style="font-variant-numeric:tabular-nums">is serving suggestions normally.</text><text x="230" y="351" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" letter-spacing="0.9" style="font-variant-numeric:tabular-nums">THE OTHER TWO REASONS THIS LINE CAN GIVE</text><text x="718.0" y="351" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" text-anchor="end" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">ONE AT A TIME</text><line x1="222" y1="358" x2="726.0" y2="358" stroke="#CBB08E" stroke-width="1.2"/><text x="228" y="378" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="500" fill="#5C5345" style="font-variant-numeric:tabular-nums">The API Key was rejected.</text><text x="228" y="391" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.45" style="font-variant-numeric:tabular-nums">CHECK IT AND PASTE IT AGAIN. THIS ONE YOU CAN FIX.</text><line x1="222" y1="398" x2="726.0" y2="398" stroke="#CBB08E" stroke-width="1"/><text x="228" y="416" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="500" fill="#5C5345" style="font-variant-numeric:tabular-nums">This key’s credit or quota is used up.</text><text x="228" y="429" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.45" style="font-variant-numeric:tabular-nums">ADD CREDIT AT THE PROVIDER, OR LEAVE CLOUD SUGGESTIONS OFF.</text><line x1="222" y1="436" x2="726.0" y2="436" stroke="#CBB08E" stroke-width="1"/><text x="758.0" y="351" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" letter-spacing="0.9" style="font-variant-numeric:tabular-nums">WHERE THIS IS VISIBLE</text><line x1="750.0" y1="358" x2="1254.0" y2="358" stroke="#CBB08E" stroke-width="1.2"/><text x="756.0" y="378" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5C5345" style="font-variant-numeric:tabular-nums">— This page is the only place an engine problem is shown.</text><text x="756.0" y="394" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5C5345" style="font-variant-numeric:tabular-nums">— No popup, banner, toast or badge in capture or review.</text><text x="756.0" y="410" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5C5345" style="font-variant-numeric:tabular-nums">— Every suggestion still arrives, served by the Rule Engine.</text><text x="756.0" y="426" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5C5345" style="font-variant-numeric:tabular-nums">— It clears on its own when the cause does.</text><text x="230" y="471" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" letter-spacing="0.9" style="font-variant-numeric:tabular-nums">SETTINGS</text><line x1="222" y1="478" x2="1254" y2="478" stroke="#CBB08E" stroke-width="1.2"/><text x="228" y="494" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">ARCHIVE RETENTION</text><text x="412" y="494" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#1B1915" style="font-variant-numeric:tabular-nums">30 days</text><text x="1248" y="494" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" text-anchor="end" letter-spacing="0.45" style="font-variant-numeric:tabular-nums">HOW LONG A COMPLETED TASK STAYS IN ITS LISTS</text><line x1="222" y1="500" x2="1254" y2="500" stroke="#CBB08E" stroke-width="1"/><text x="228" y="518" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">TASK TEXT</text><text x="412" y="518" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#1B1915" style="font-variant-numeric:tabular-nums">English only, by decision</text><text x="1248" y="518" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" text-anchor="end" letter-spacing="0.45" style="font-variant-numeric:tabular-nums">THE KEYWORD TABLES AND DATE WORDS ARE ENGLISH</text><line x1="222" y1="524" x2="1254" y2="524" stroke="#CBB08E" stroke-width="1"/><text x="228" y="542" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">INTERFACE LANGUAGE</text><text x="412" y="542" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#1B1915" style="font-variant-numeric:tabular-nums">English — not yet decided</text><text x="1248" y="542" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" text-anchor="end" letter-spacing="0.45" style="font-variant-numeric:tabular-nums">AN OPEN QUESTION, NOT A SETTLED ONE</text><line x1="222" y1="548" x2="1254" y2="548" stroke="#CBB08E" stroke-width="1"/></svg>
C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">SUGGESTIONS ARE RIGHT.</text><text x="22" y="487" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" letter-spacing="0.9" style="font-variant-numeric:tabular-nums">SETTINGS</text><line x1="14" y1="494" x2="346" y2="494" stroke="#CBB08E" stroke-width="1.2"/><text x="20" y="509" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">ARCHIVE RETENTION</text><text x="190" y="510" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#1B1915" style="font-variant-numeric:tabular-nums">30 days</text><line x1="14" y1="516" x2="346" y2="516" stroke="#CBB08E" stroke-width="1"/><text x="20" y="533" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">TASK TEXT</text><text x="190" y="534" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#1B1915" style="font-variant-numeric:tabular-nums">English only, by decision</text><line x1="14" y1="540" x2="346" y2="540" stroke="#CBB08E" stroke-width="1"/><text x="20" y="557" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">INTERFACE LANGUAGE</text><text x="190" y="558" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#1B1915" style="font-variant-numeric:tabular-nums">English — not yet decided</text><line x1="14" y1="564" x2="346" y2="564" stroke="#CBB08E" stroke-width="1"/><line x1="14" y1="726" x2="346" y2="726" stroke="#CBB08E" stroke-width="1"/><text x="14" y="740" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.45" style="font-variant-numeric:tabular-nums">AN ENGINE PROBLEM, IF THERE IS EVER ONE, IS SHOWN ONLY HERE —</text><text x="14" y="750" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.45" style="font-variant-numeric:tabular-nums">NEVER A POPUP, BANNER, TOAST OR BADGE ANYWHERE ELSE</text><rect x="0" y="754" width="360" height="46" fill="#EDE4D3"/><line x1="0" y1="754" x2="360" y2="754" stroke="#9B6B3F" stroke-width="1.2"/><g fill="none" stroke="#5C5345" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter"><rect x="43" y="767" width="13" height="12"/><line x1="43" y1="771" x2="56" y2="771"/><line x1="47" y1="765" x2="47" y2="768"/><line x1="52" y1="765" x2="52" y2="768"/></g><text x="49" y="792" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" text-anchor="middle" letter-spacing="0.7" style="font-variant-numeric:tabular-nums">TODAY</text><g fill="none" stroke="#5C5345" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter"><line x1="129" y1="768" x2="142" y2="768"/><line x1="129" y1="772.5" x2="142" y2="772.5"/><line x1="129" y1="777" x2="142" y2="777"/></g><text x="135" y="792" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" text-anchor="middle" letter-spacing="0.7" style="font-variant-numeric:tabular-nums">LISTS</text><g fill="none" stroke="#5C5345" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter"><rect x="215" y="766" width="13" height="4"/><path d="M216.5 770 v8 h10 v-8"/><line x1="220" y1="773.5" x2="223" y2="773.5"/></g><text x="221" y="792" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" text-anchor="middle" letter-spacing="0.7" style="font-variant-numeric:tabular-nums">ARCHIVE</text><g fill="none" stroke="#1B1915" 
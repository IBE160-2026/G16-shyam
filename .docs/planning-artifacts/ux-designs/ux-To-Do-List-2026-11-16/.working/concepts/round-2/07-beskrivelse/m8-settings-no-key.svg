ric:tabular-nums">No API Key is configured.</text><text x="26" y="131" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">PRODUCED ON THIS DEVICE, OFFLINE. THE NORMAL STATE,</text><text x="26" y="142" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">NOT A LIMITATION.</text><line x1="14" y1="146" x2="346" y2="146" stroke="#CBB08E" stroke-width="1"/><text x="22" y="173" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" letter-spacing="0.9" style="font-variant-numeric:tabular-nums">API KEY</text><text x="338" y="173" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" text-anchor="end" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">OPTIONAL</text><line x1="14" y1="180" x2="346" y2="180" stroke="#CBB08E" stroke-width="1.2"/><rect x="14" y="186" width="248" height="28" fill="#FFFFFF"/><rect x="14" y="186" width="248" height="28" fill="none" stroke="#5C5345" stroke-width="1"/><text x="24" y="204.0" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5C5345" style="font-variant-numeric:tabular-nums">Paste an Anthropic API Key</text><rect x="270" y="186" width="76" height="28" fill="#FFFFFF"/><rect x="270" y="186" width="76" height="28" fill="none" stroke="#5C5345" stroke-width="1"/><text x="308.0" y="203.6" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#1B1915" text-anchor="middle" letter-spacing="0.7" style="font-variant-numeric:tabular-nums">SAVE</text><text x="14" y="228" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">STORED ON THIS DEVICE ONLY. NEVER WRITTEN TO THE REPOSITORY,</text><text x="14" y="239" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">AND NEVER SENT ANYWHERE BUT ANTHROPIC.</text><text x="22" y="267" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" letter-spacing="0.9" style="font-variant-numeric:tabular-nums">CLOUD SUGGESTIONS</text><text x="338" y="267" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" text-anchor="end" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">OFF</text><line x1="14" y1="274" x2="346" y2="274" stroke="#CBB08E" stroke-width="1.2"/><rect x="14" y="278" width="332" height="44" fill="#E2EEF7" opacity="0.5"/><rect x="14" y="278" width="332" height="44" fill="none" stroke="#CBB08E" stroke-width="1" stroke-dasharray="4 3"/><text x="24" y="296" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#1F5878" letter-spacing="0.7" style="font-variant-numeric:tabular-nums">APPEARS ONCE A KEY IS SAVED</text><text x="24" y="312" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">OFF UNTIL YOU TURN IT ON. SAVING A KEY NEVER TURNS IT ON.</text><text x="22" y="351" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" letter-spacing="0.9" style="font-variant-numeric:tabular-nums">MEASURED ACCURACY</text><text x="338" y="351" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" text-anchor="end" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">PUBLISHED, NOT CLAIMED</text><line x1="14" y1="358" 
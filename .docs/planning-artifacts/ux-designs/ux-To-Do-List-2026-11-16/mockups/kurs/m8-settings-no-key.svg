<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800"><rect x="0" y="0" width="360" height="800" fill="#FCFBF8"/><rect x="0" y="0" width="360" height="40" fill="#EDE4D3"/><text x="14" y="26" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="14" font-weight="700" fill="#1B1915" letter-spacing="1.5" style="font-variant-numeric:tabular-nums">SETTINGS</text><text x="346" y="26" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" text-anchor="end" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">MON 16 NOV</text><line x1="0" y1="40" x2="360" y2="40" stroke="#9B6B3F" stroke-width="1.2"/><text x="22" y="67" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" letter-spacing="0.9" style="font-variant-numeric:tabular-nums">SUGGESTION ENGINE</text><line x1="14" y1="74" x2="346" y2="74" stroke="#CBB08E" stroke-width="1.2"/><rect x="14" y="74" width="332" height="82" fill="#FFFFFF"/><rect x="14" y="74" width="332" height="82" fill="none" stroke="#9B6B3F" stroke-width="1.2"/><rect x="26" y="88" width="10" height="10" fill="none" stroke="#5C5345" stroke-width="1"/><text x="31" y="95.4" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="7.5" font-weight="700" fill="#5C5345" text-anchor="middle" style="font-variant-numeric:tabular-nums">R</text><text x="40" y="96" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="11" font-weight="700" fill="#5C5345" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">RULE ENGINE</text><rect x="268" y="84" width="66" height="16" fill="#1B1915"/><text x="301" y="95" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8" style="font-variant-numeric:tabular-nums">SERVING</text><text x="26" y="118" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="500" fill="#1B1915" style="font-variant-numeric:tabular-nums">No API Key is configured.</text><text x="26" y="133" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">EVERY SUGGESTION IS PRODUCED BY THE RULE ENGINE, ON THIS DEVICE,</text><text x="26" y="144" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">OFFLINE. THIS IS THE NORMAL STATE, NOT A LIMITATION.</text><text x="22" y="183" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" letter-spacing="0.9" style="font-variant-numeric:tabular-nums">API KEY</text><text x="338" y="183" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" text-anchor="end" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">OPTIONAL</text><line x1="14" y1="190" x2="346" y2="190" stroke="#CBB08E" stroke-width="1.2"/><rect x="14" y="196" width="250" height="28" fill="#FFFFFF"/><rect x="14" y="196" width="250" height="28" fill="none" stroke="#5C5345" stroke-width="1"/><text x="24" y="214.0" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5C5345" style="font-variant-numeric:tabular-nums">Paste an Anthropic API Key</text><rect x="272" y="196" width="74" height="28" fill="#FFFFFF"/><rect x="272" y="196" width="74" height="28" fill="none" stroke="#5C5345" stroke-width="1"/><text x="309.0" y="213.6" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#1B1915" text-anchor="middle" letter-spacing="0.7" style="font-variant-numeric:tabular-nums">SAVE</text><text x="14" y="238" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">STORED ON THIS DEVICE ONLY. NEVER WRITTEN TO THE REPOSITORY,</text><text x="14" y="249" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">AND NEVER SENT ANYWHERE BUT ANTHROPIC.</text><text x="22" y="279" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" letter-spacing="0.9" style="font-variant-numeric:tabular-nums">CLOUD SUGGESTIONS</text><text x="338" y="279" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" text-anchor="end" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">OFF</text><line x1="14" y1="286" x2="346" y2="286" stroke="#CBB08E" stroke-width="1.2"/><rect x="14" y="290" width="332" height="48" fill="#E2EEF7" opacity="0.5"/><rect x="14" y="290" width="332" height="48" fill="none" stroke="#CBB08E" stroke-width="1" stroke-dasharray="4 3"/><text x="26" y="310" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10" font-weight="700" fill="#1F5878" letter-spacing="0.7" style="font-variant-numeric:tabular-nums">APPEARS ONCE A KEY IS SAVED</text><text x="26" y="326" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">OFF UNTIL YOU TURN IT ON. SAVING A KEY NEVER TURNS IT ON.</text><text x="22" y="367" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" letter-spacing="0.9" style="font-variant-numeric:tabular-nums">MEASURED ACCURACY</text><line x1="14" y1="374" x2="346" y2="374" stroke="#CBB08E" stroke-width="1.2"/><text x="20" y="386" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">FIXTURE ENTRIES</text><text x="340" y="386" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#1B1915" text-anchor="end" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">NOT SCORED YET</text><line x1="14" y1="392" x2="346" y2="392" stroke="#CBB08E" stroke-width="1"/><text x="20" y="409" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">TAGS · PRIORITY · DUE DATE · PLACEMENT</text><text x="340" y="409" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#1B1915" text-anchor="end" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">REPORTED APART</text><line x1="14" y1="415" x2="346" y2="415" stroke="#CBB08E" stroke-width="1"/><text x="20" y="432" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">SUMMARY</text><text x="340" y="432" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#1B1915" text-anchor="end" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">SCORED SEPARATELY</text><line x1="14" y1="438" x2="346" y2="438" stroke="#CBB08E" stroke-width="1"/><text x="14" y="457" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">THE APP PUBLISHES ITS OWN SCORE. IT DOES NOT CLAIM THE</text><text x="14" y="468" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.5" style="font-variant-numeric:tabular-nums">SUGGESTIONS ARE RIGHT.</text><text x="22" y="498" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10.5" font-weight="700" fill="#1B1915" letter-spacing="0.9" style="font-variant-numeric:tabular-nums">ARCHIVE</text><line x1="14" y1="505" x2="346" y2="505" stroke="#CBB08E" stroke-width="1.2"/><text x="14" y="529" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9.5" font-weight="700" fill="#5C5345" letter-spacing="0.6" style="font-variant-numeric:tabular-nums">ARCHIVE COMPLETED TASKS AFTER</text><rect x="214" y="513" width="132" height="24" fill="#FFFFFF"/><rect x="214" y="513" width="132" height="24" fill="none" stroke="#5C5345" stroke-width="1"/><text x="223" y="529.0" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#1B1915" style="font-variant-numeric:tabular-nums">30 days</text><path d="M327 523.0 l4.5 4.5 l4.5 -4.5" fill="none" stroke="#5C5345" stroke-width="1.3"/><line x1="14" y1="726" x2="346" y2="726" stroke="#CBB08E" stroke-width="1"/><text x="14" y="740" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.45" style="font-variant-numeric:tabular-nums">AN ENGINE PROBLEM, IF THERE IS EVER ONE, IS SHOWN ONLY HERE —</text><text x="14" y="750" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" letter-spacing="0.45" style="font-variant-numeric:tabular-nums">NEVER A POPUP, BANNER, TOAST OR BADGE ANYWHERE ELSE</text><rect x="0" y="754" width="360" height="46" fill="#EDE4D3"/><line x1="0" y1="754" x2="360" y2="754" stroke="#9B6B3F" stroke-width="1.2"/><g fill="none" stroke="#5C5345" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter"><rect x="43" y="767" width="13" height="12"/><line x1="43" y1="771" x2="56" y2="771"/><line x1="47" y1="765" x2="47" y2="768"/><line x1="52" y1="765" x2="52" y2="768"/></g><text x="49" y="792" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" text-anchor="middle" letter-spacing="0.7" style="font-variant-numeric:tabular-nums">TODAY</text><g fill="none" stroke="#5C5345" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter"><line x1="129" y1="768" x2="142" y2="768"/><line x1="129" y1="772.5" x2="142" y2="772.5"/><line x1="129" y1="777" x2="142" y2="777"/></g><text x="135" y="792" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" text-anchor="middle" letter-spacing="0.7" style="font-variant-numeric:tabular-nums">LISTS</text><g fill="none" stroke="#5C5345" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter"><rect x="215" y="766" width="13" height="4"/><path d="M216.5 770 v8 h10 v-8"/><line x1="220" y1="773.5" x2="223" y2="773.5"/></g><text x="221" y="792" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#5C5345" text-anchor="middle" letter-spacing="0.7" style="font-variant-numeric:tabular-nums">ARCHIVE</text><g fill="none" stroke="#1B1915" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><circle cx="307.5" cy="772" r="3.2"/><path d="M307.5 765.5 v2.2 M307.5 775.8 v2.2 M300.6 772 h2.2 M312.2 772 h2.2"/></g><text x="307" y="792" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="9" font-weight="700" fill="#1B1915" text-anchor="middle" letter-spacing="0.7" style="font-variant-numeric:tabular-nums">SETTINGS</text><rect x="292" y="756" width="31" height="2.2" fill="#1B1915"/></svg>